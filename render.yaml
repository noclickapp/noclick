# One-click deploy to Render: the application and a Postgres database.
#
# Nothing to fill in. The whole application runs in one container — backend,
# app, front door, and Supabase's auth layer on one port
# (docker/single-origin.Dockerfile) — so the database below is the only thing
# it needs, and Render creates that here. Every secret is generated by Render
# and kept in the service's own environment.
#
# Deploy directly with:
#   https://render.com/deploy?repo=https://github.com/noclickapp/noclick

databases:
  - name: noclick-db
    databaseName: noclick
    user: noclick
    # `free` also works and is what a trial deserves, but Render deletes a free
    # database after 30 days — a surprising way to lose an instance's workflows.
    # Plan names are Render's cpu-memory shapes (the spec lists them).
    plan: 0.1c-256mb
    postgresMajorVersion: "16"

services:
  - type: web
    name: noclick
    # The reviewed release image rather than a build of the current default
    # branch: identical to what the other one-click deploys run, and it skips a
    # frontend build that wants more memory than a small instance has.
    runtime: image
    image:
      url: ghcr.io/noclickapp/noclick:0.2.7
    # The scheduler and the realtime relay run inside this process, so the
    # instance count is one by design — see docs/self-hosting.md.
    numInstances: 1
    plan: standard
    # An instance created from the public deploy button stays on the release it
    # was created with until its operator chooses a newer one. (A prebuilt image
    # never auto-deploys anyway; this states the intent for the day it builds.)
    autoDeployTrigger: off
    healthCheckPath: /health
    # Agent workspaces live here: the files an agent writes while it works, and
    # the cached environments code nodes run in. Without a disk they would be
    # recreated on every deploy.
    disk:
      name: noclick-state
      mountPath: /var/lib/noclick
      sizeGB: 10
    envVars:
      - key: POSTGRES_URL
        fromDatabase:
          name: noclick-db
          property: connectionString

      # ── This instance's keys ────────────────────────────────────────────────
      # Generated once, by Render, and kept in the service's environment.
      # CREDENTIALS_ENCRYPTION_KEY encrypts every stored integration credential:
      # copy it somewhere safe, because credentials cannot be read without it.
      - key: CREDENTIALS_ENCRYPTION_KEY
        generateValue: true
      # Signs sessions the auth server issues, and the anon and service keys
      # derived from it.
      - key: JWT_SECRET
        generateValue: true
      - key: WORKFLOW_JWT_SECRET
        generateValue: true
      - key: CRON_SCHEDULER_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true

# Object storage is not created here, so file and media features stay off until
# OBJECT_STORAGE_ENDPOINT, OBJECT_STORAGE_ACCESS_KEY_ID and
# OBJECT_STORAGE_SECRET_ACCESS_KEY are set on the service. Any S3-compatible
# provider works; see docs/self-hosting.md.
