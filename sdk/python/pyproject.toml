[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "noclick"
version = "0.2.2"
description = "NoClick SDK: users, connections, tools, humans and agents for your product"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["noclick", "agents", "automation", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = ["httpx>=0.25"]

[project.urls]
Homepage = "https://noclick.com"
Documentation = "https://noclick.com/docs"
Source = "https://github.com/noclickapp/noclick/tree/main/sdk/python"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.21", "respx>=0.20"]
# `noclick login` keeps its key in the OS keychain; `noclick machines ssh` speaks websockets.
cli = ["keyring>=24", "websockets>=12"]
# `noclick.watch` follows changes over a websocket.
live = ["websockets>=13"]

[project.scripts]
noclick = "noclick.cli:main"

[tool.setuptools.packages.find]
include = ["noclick*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
