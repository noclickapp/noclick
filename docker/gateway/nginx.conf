# Supabase-compatible front door.
#
# `@supabase/supabase-js` addresses one origin and routes by path prefix, so
# auth and PostgREST have to share a host. This is the whole gateway: the
# managed product puts Kong here, but the community stack exposes two upstreams
# and a declarative Kong config would be more moving parts than routing rules.

events {}

http {
    access_log /dev/stdout;
    error_log  /dev/stderr;

    # WebSocket-safe defaults, harmless for the plain HTTP calls here.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Resolve upstreams per request through Docker's DNS rather than at startup.
    # nginx refuses to boot on an unresolvable upstream name, which would make
    # this container's health depend on the order services happen to start in.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8001;
        # Uploads go straight to object storage against a presigned URL, so
        # nothing large passes through here.
        client_max_body_size 8m;

        # The prefix is captured and re-appended explicitly: with a variable in
        # proxy_pass, nginx does not rewrite the location prefix for you.
        location ~ ^/auth/v1/(?<auth_path>.*)$ {
            set $auth_upstream auth;
            proxy_pass http://$auth_upstream:9999/$auth_path$is_args$args;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location ~ ^/rest/v1/(?<rest_path>.*)$ {
            set $rest_upstream rest;
            proxy_pass http://$rest_upstream:3000/$rest_path$is_args$args;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /health {
            add_header Content-Type text/plain;
            return 200 'ok';
        }

        location / {
            add_header Content-Type application/json;
            return 404 '{"message":"not found"}';
        }
    }
}
