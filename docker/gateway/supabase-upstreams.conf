# The auth stack, on the application's own origin.
#
# `@supabase/supabase-js` addresses one origin and routes by path prefix, so
# these two paths are what makes SUPABASE_URL and the app's public URL the same
# string — and an instance that needs no Supabase project to point at.
#
# The entrypoint copies this file into the included directory only when the
# embedded stack is running; with an external project the directory stays empty
# and nginx serves those paths to the app like any other.

# The prefix is captured and re-appended explicitly: with a variable in
# proxy_pass, nginx does not rewrite the location prefix for you.
location ~ ^/auth/v1/(?<auth_path>.*)$ {
    set $auth_upstream 127.0.0.1:9999;
    proxy_pass http://$auth_upstream/$auth_path$is_args$args;
    include /etc/nginx/noclick-proxy.conf;
}

location ~ ^/rest/v1/(?<rest_path>.*)$ {
    set $rest_upstream 127.0.0.1:3001;
    proxy_pass http://$rest_upstream/$rest_path$is_args$args;
    include /etc/nginx/noclick-proxy.conf;
}
