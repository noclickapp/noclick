# Shared by every location in single-origin.conf: pass the client's identity
# through, and let a connection upgrade to a websocket.
proxy_http_version 1.1;
# $http_host, not $host: $host drops the port, so an app on :8080 is told it
# is on `localhost` and computes its own origin as `http://localhost`. React
# Router compares that against the browser's Origin header before running an
# action, and rejects every form post on the site as cross-origin.
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
# $forwarded_proto, not the raw client header: when nothing in front sends one
# this must fall back to the scheme nginx was reached on. An EMPTY
# X-Forwarded-Proto is worse than none — the app computes its own origin from
# it and rejects its own form posts as cross-origin.
proxy_set_header X-Forwarded-Proto $forwarded_proto;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
