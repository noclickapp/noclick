spec:
  name: noclick
  region: nyc
  services:
    - name: noclick
      git:
        branch: main
        repo_clone_url: https://github.com/noclickapp/noclick.git
      dockerfile_path: docker/single-origin.Dockerfile
      source_dir: /
      http_port: 8080
      instance_count: 1
      instance_size_slug: apps-s-2vcpu-4gb
      health_check:
        http_path: /health
        initial_delay_seconds: 30
        period_seconds: 30
        timeout_seconds: 5
        success_threshold: 1
        failure_threshold: 5
      envs:
        - key: VITE_PUBLIC_URL
          value: ${APP_URL}
          scope: RUN_TIME
        - key: VITE_DISABLE_CAPTCHA
          value: "true"
          scope: RUN_AND_BUILD_TIME
        - key: NOCLICK_BOOTSTRAP_ON_START
          value: "1"
          scope: RUN_TIME
        - key: POSTGRES_URL
          value: REPLACE_WITH_SUPABASE_DIRECT_DATABASE_URL
          scope: RUN_TIME
          type: SECRET
        - key: POSTGRES_POOLER_URL
          value: REPLACE_WITH_SUPABASE_POOLER_DATABASE_URL
          scope: RUN_TIME
          type: SECRET
        - key: SUPABASE_URL
          value: REPLACE_WITH_SUPABASE_PROJECT_URL
          scope: RUN_TIME
        - key: SUPABASE_ANON_KEY
          value: REPLACE_WITH_SUPABASE_ANON_KEY
          scope: RUN_TIME
          type: SECRET
        - key: SUPABASE_SECRET_KEY
          value: REPLACE_WITH_SUPABASE_SECRET_KEY
          scope: RUN_TIME
          type: SECRET
        - key: SUPABASE_JWK_URL
          value: REPLACE_WITH_SUPABASE_JWKS_URL
          scope: RUN_TIME
        - key: CREDENTIALS_ENCRYPTION_KEY
          value: REPLACE_WITH_A_FERNET_KEY
          scope: RUN_TIME
          type: SECRET
        - key: WORKFLOW_JWT_SECRET
          value: REPLACE_WITH_A_LONG_RANDOM_SECRET
          scope: RUN_TIME
          type: SECRET
        - key: CRON_SCHEDULER_SECRET
          value: REPLACE_WITH_A_LONG_RANDOM_SECRET
          scope: RUN_TIME
          type: SECRET
        - key: SESSION_SECRET
          value: REPLACE_WITH_A_LONG_RANDOM_SECRET
          scope: RUN_TIME
          type: SECRET
