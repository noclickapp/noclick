# One-click deploy to DigitalOcean App Platform: the application and a database.
#
# Nothing to fill in. The whole application runs in one container — backend,
# app, front door, and Supabase's auth layer on one port — so the development
# database below is the only thing it needs.
#
# App Platform can neither generate a secret nor mount a disk, so this instance
# mints its own keys on first boot and keeps them in its database. To hold the
# credential-encryption key somewhere stronger instead, set
# CREDENTIALS_ENCRYPTION_KEY on the service before the first deploy and it will
# be used as-is — see docs/self-hosting.md.
spec:
  name: noclick
  region: nyc
  databases:
    - name: db
      engine: PG
      version: "16"
      # A development database, created with the app and billed with it. Set
      # `production: true` and name a cluster for a managed database with
      # backups and failover.
      production: false
  services:
    - name: noclick
      # The reviewed release image, not a build of the current default branch —
      # the same artifact the other one-click deploys run.
      image:
        registry_type: GHCR
        registry: noclickapp
        repository: noclick
        tag: "0.2.0"
      http_port: 8080
      # The scheduler and the realtime relay run inside this process, so one
      # instance is by design — see docs/self-hosting.md.
      instance_count: 1
      instance_size_slug: apps-s-2vcpu-4gb
      health_check:
        http_path: /health
        initial_delay_seconds: 60
        period_seconds: 30
        timeout_seconds: 5
        success_threshold: 1
        failure_threshold: 5
      envs:
        - key: POSTGRES_URL
          value: ${db.DATABASE_URL}
          scope: RUN_TIME
        # App Platform injects nothing the image can derive its own address
        # from (Render and Railway do), and the auth server, OAuth callbacks
        # and webhooks are all minted from it. Both values are the platform's
        # own bindables — still nothing for a person to type.
        - key: VITE_PUBLIC_URL
          value: ${APP_URL}
          scope: RUN_TIME
