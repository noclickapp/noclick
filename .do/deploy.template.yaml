# Deploy to DigitalOcean App Platform: the application, bound to a managed
# database you create first (see `databases` below — the one step the platform
# leaves to you).
#
# Nothing to fill in on the form. The whole application runs in one container —
# backend, app, front door, and Supabase's auth layer on one port — so the
# database is the only thing it needs.
#
# App Platform can neither generate a secret nor mount a disk, so this instance
# mints its own keys on first boot and keeps them in its database. The database
# is a managed one because the development database's user cannot create the
# schemas and roles the auth layer needs. To hold the
# credential-encryption key somewhere stronger instead, set
# CREDENTIALS_ENCRYPTION_KEY on the service before the first deploy and it will
# be used as-is — see docs/self-hosting.md.
spec:
  name: noclick
  region: nyc
  databases:
    - name: db
      engine: PG
      version: "16"
      # A managed cluster you create first, named `noclick-db`, in the app's
      # region. App Platform will not create one from a spec, and the
      # development database it would create cannot host the auth layer: its
      # user can create neither schemas nor roles, and the container died in
      # bootstrap with "permission denied for database" on it. The smallest
      # cluster (1 vCPU, 1 GB, one node) is plenty.
      production: true
      cluster_name: noclick-db
  services:
    - name: noclick
      # The reviewed release image, not a build of the current default branch —
      # the same artifact the other one-click deploys run.
      image:
        registry_type: GHCR
        registry: noclickapp
        repository: noclick
        tag: "0.2.11"
      http_port: 8080
      # The scheduler and the realtime relay run inside this process, so one
      # instance is by design — see docs/self-hosting.md.
      instance_count: 1
      instance_size_slug: apps-s-2vcpu-4gb
      health_check:
        http_path: /health
        initial_delay_seconds: 60
        period_seconds: 30
        timeout_seconds: 5
        success_threshold: 1
        failure_threshold: 5
      envs:
        - key: POSTGRES_URL
          value: ${db.DATABASE_URL}
          scope: RUN_TIME
        # App Platform injects nothing the image can derive its own address
        # from (Render and Railway do), and the auth server, OAuth callbacks
        # and webhooks are all minted from it. Both values are the platform's
        # own bindables — still nothing for a person to type.
        - key: VITE_PUBLIC_URL
          value: ${APP_URL}
          scope: RUN_TIME
