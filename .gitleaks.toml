# gitleaks' default rules, with the made-up values the SDKs' docstrings and tests use allowed
# for the one rule they trip, and only in the files that use them.
[extend]
useDefault = true

[[allowlists]]
description = "An example connection id in docstrings and tests"
targetRules = ["generic-api-key"]
condition = "AND"
regexes = ['''^9b2a1c5e-7d9f-4a31-8f6d-3f1d2c4b8a7e$''']
paths = [
  '''(?:^|/)sdk/python/noclick/(?:connection|workflow)\.py$''',
  '''(?:^|/)sdk/python/tests/test_(?:connect|triggers|workflow_graph)\.py$''',
  '''(?:^|/)sdk/typescript/test/(?:connection_plan_usage|connections_app|triggers|workflow_graph)\.test\.ts$''',
]

[[allowlists]]
description = "An example secret's id in tests"
targetRules = ["generic-api-key"]
condition = "AND"
regexes = ['''^2a7f0c3e-9d1b-4e6a-8c5f-3b0e7d2a9c14$''']
paths = [
  '''(?:^|/)sdk/python/tests/test_designed_volumes_secrets\.py$''',
  '''(?:^|/)sdk/typescript/test/designed_volumes_secrets\.test\.ts$''',
]

[[allowlists]]
description = "A fake webhook signing secret in tests"
targetRules = ["generic-api-key"]
condition = "AND"
regexes = ['''^nk_whsec_3f9c2a7e5b1d4c8a$''']
paths = [
  '''(?:^|/)sdk/python/tests/test_webhooks\.py$''',
  '''(?:^|/)sdk/typescript/test/webhooks\.test\.ts$''',
]

[[allowlists]]
description = "A fake API key in the CLI's tests"
targetRules = ["generic-api-key"]
condition = "AND"
regexes = ['''^nk_live_cli9f2c1a77$''']
paths = ['''(?:^|/)sdk/python/tests/test_cli\.py$''']
