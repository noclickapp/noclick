<!-- Self-contained favicon: white NoClick mark on a baked-in black disc.
     Kept separate from /logo.svg, which is a bare white glyph that only reads
     correctly with the CSS invert filter LogoMark applies - raw-file consumers
     (search crawlers, favicon services) never apply that filter.
     Geometry is a vector match for favicon.ico so the two never disagree:
     inscribed disc, glyph at 64% of the canvas, both centred. -->
