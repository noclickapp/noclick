<!-- Hermes "H" marker: the leading H glyph cropped from hermes.svg (the full
     HERMES-AGENT pixel wordmark) by keeping only its path segments (left bar,
     crossbar, right bar + bevels; everything before the "E" at x=48) and
     tightening the viewBox. Used as the compact dropdown/chip icon so it matches
     the wordmark's pixel-art font + gold→amber→bronze gradient instead of a
     plain sans-serif letter. -->
