<!-- Affinity CRM logo — 4 rings in 2×2 grid connecting at cardinal midpoints -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Affinity CRM">
  <defs>
    <linearGradient id="aff-grad" gradientUnits="userSpaceOnUse" x1="80" y1="512" x2="944" y2="512">
      <stop offset="0%"   stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- 4 rings: centers spaced 408px apart, radius = 204 (half the spacing) so rings are tangent at midpoints -->
  <g stroke="url(#aff-grad)" stroke-width="116" fill="none">
    <circle cx="308" cy="308" r="204"/>
    <circle cx="716" cy="308" r="204"/>
    <circle cx="308" cy="716" r="204"/>
    <circle cx="716" cy="716" r="204"/>
  </g>

  <!-- Solid node dots at the 5 connection points (cardinal midpoints + center) -->
  <g fill="url(#aff-grad)">
    <circle cx="512" cy="308" r="58"/>
    <circle cx="308" cy="512" r="58"/>
    <circle cx="512" cy="512" r="58"/>
    <circle cx="716" cy="512" r="58"/>
    <circle cx="512" cy="716" r="58"/>
  </g>
</svg>
