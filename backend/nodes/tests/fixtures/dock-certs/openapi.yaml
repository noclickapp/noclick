      tags:
        - credentials
      summary: Delete a Credential
      description:
        Deletes all credential metadata and contents from the client. More info about [Delete
        Credentials](https://docs.truvera.io/developer-documentation/truvera-api/credentials)
      responses:
        '200':
          description: Credential has been deleted.
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Credential was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Error retrieving the credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
