  /dids:
    post:
      tags:
        - dids
      summary: Create DID
      description:
        Creates a new DID on chain with an auto generated keypair, the controller will be the same
        as the DID unless otherwise specified. More info about [Create
        DID](https://docs.truvera.io/developer-documentation/truvera-api/dids)
      requestBody:
        description: Properties of DID
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  default: cheqd
                  type: string
                  enum:
                    - cheqd
                    - dock
                    - key
                did:
                  $ref: '#/components/schemas/DID'
                controller:
                  $ref: '#/components/schemas/DID'
                keyType:
                  $ref: '#/components/schemas/KeyType'
                didcommServiceUrl:
                  type: string
                  format: uri
                  description:
                    Optional custom DIDComm service endpoint URL. If not provided, a default URL
                    will be generated using the server URL and DID. This is not supported for
                    `did:key`.
                  example: 'https://api.example.com/messaging/did:cheqd:testnet:abc123/receive'
                includeDidcommService:
                  type: boolean
                  default: true
                  description:
                    Whether to include a DIDComm service endpoint in the DID document. Defaults to
                    true. Set to false to create a DID without DIDComm service endpoint.
              example:
                type: cheqd
                did: did:cheqd:testnet:3b68ef6c-1eea-493e-9fd5-6f51e5a87fa9
                controller: did:cheqd:testnet:3b68ef6c-1eea-493e-9fd5-6f51e5a87fa9
                keyType: 'ed25519'
      responses:
        '200':
          description: DID will be created on the network.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStartedResult'
              example:
                id: '2432'
                data:
                  did: 'did:cheqd:testnet:f48d2ace-4947-4cb7-8550-1cef3d63e651'
                  controller: 'did:cheqd:testnet:f48d2ace-4947-4cb7-8550-1cef3d63e651'
        '400':
          description: Invalid params
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '402':
          description: Transaction limit reached or upgrade required to proceed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict or duplicate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags:
        - dids
      summary: List DIDs
      description:
        Return a list of all DIDs that your user account controls as fully resolved DID documents.
        More info about [Get DID](https://docs.truvera.io/developer-documentation/truvera-api/dids)
      parameters:
        - name: offset
          in: query
          description: How many items to offset by for pagination
          required: false
          schema:
            type: integer
            format: int32
            default: 0
            minimum: 0
        - name: limit
          in: query
          description: How many items to return at one time (max 64)
          required: false
          schema:
            type: integer
            format: int32
            default: 64
            minimum: 1
            maximum: 64
        - name: type
          in: query
          description: The type of DID for filtering
          required: false
          schema:
            type: string
      responses:
        '200':
          description: All of a user's DIDs with additional information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DIDsResponse'
        '400':
          description: Application error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /dids/import:
    post:
      tags:
        - dids
      summary: Import DIDs
      description:
        Import DIDs from JSON objects
        ([DIDResolutionResponse](https://www.w3.org/TR/did-resolution/) or [Universal
        Wallet](https://w3c-ccg.github.io/universal-wallet-interop-spec/) format). Supports both
        encrypted and plaintext wallet exports.
      requestBody:
        description: Import data containing DIDs to import
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - data
              properties:
                data:
                  description:
                    Import data - can be DIDResolutionResponse JSON-LD document, universal wallet
                    export, or array of either
                  oneOf:
                    - type: string
                      description: JSON string containing import data
                    - type: object
                      description: Single DID import object
                    - type: array
                      description: Array of DID import objects
                password:
                  type: string
                  description: Password for encrypted wallet imports
                  maxLength: 128
                  minLength: 8
              example:
                data:
                  '@context': ['https://w3id.org/wallet/v1', 'https://w3id.org/did-resolution/v1']
                  id: 'did:key:z6MkpTHR8VNsBxYAAWHut2Geadd9jSwuBV8xRoAnwWsdvktH'
                  type: ['DIDResolutionResponse']
                  name: 'Imported DID'
                  description: 'A DID imported from JSON'
                  didDocument:
                    '@context': ['https://www.w3.org/ns/did/v1']
                    id: 'did:key:z6MkpTHR8VNsBxYAAWHut2Geadd9jSwuBV8xRoAnwWsdvktH'
                    verificationMethod: []
      responses:
        '200':
          description: DIDs imported successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  imported:
                    type: integer
                    description: Number of DIDs successfully imported
                  dids:
                    type: array
                    description: Array of imported DID information
                    items:
                      type: object
                      properties:
                        did:
                          $ref: '#/components/schemas/DID'
                        controller:
                          $ref: '#/components/schemas/DID'
                        keyCount:
                          type: integer
                          description: Number of keys imported for this DID
                        profile:
                          type: object
                          description: DID profile information if available
                          properties:
                            name:
                              type: string
                            description:
                              type: string
              example:
                imported: 1
                dids:
                  - did: 'did:key:z6MkpTHR8VNsBxYAAWHut2Geadd9jSwuBV8xRoAnwWsdvktH'
                    controller: 'did:key:z6MkpTHR8VNsBxYAAWHut2Geadd9jSwuBV8xRoAnwWsdvktH'
                    keyCount: 1
                    profile:
                      name: 'Imported DID'
                      description: 'A DID imported from JSON'
        '400':
          description: Invalid import data or missing required fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '402':
          description: Payment required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: DID not found or cannot be resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
