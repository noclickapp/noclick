                $ref: '#/components/schemas/Error'
  /messaging/encrypt:
    post:
      tags:
        - messaging
      description: Messaging encrypt
      requestBody:
        description: The recipients, sender and message
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - payload
                - senderDid
                - recipientDids
              properties:
                type:
                  type: string
                  maxLength: 128
                payload:
                  type: object
                senderDid:
                  type: string
                  maxLength: 512
                algorithm:
                  type: string
                  default: ECDH-1PU+A256KW
                  enum: [ECDH-1PU+A256KW, ECDH-ES+A256KW]
                recipientDids:
                  type: array
                  items:
                    oneOf:
                      - type: string
      responses:
        '200':
          description: Message has been encrypted, returning an encrypted DIDComm Message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        '400':
          description: Message failed to encrypt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: DID was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '402':
          description: Transaction limit reached or upgrade required to proceed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

