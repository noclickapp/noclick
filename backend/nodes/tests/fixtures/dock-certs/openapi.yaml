openapi: 3.0.2
info:
  version: '1'
  title: Truvera API
  description: |
    Truvera provides a complete solution for creating and managing verifiable credentials on the blockchain. This includes a free trial and simple, monthly pricing. For more info about [Truvera Pricing](https://www.truvera.io/pricing).   <br />
    <br /> 1- Get your first API key after login from [Truvera Workspace](https://truvera.io/).
    <br />2- Create the `API Key` by switching to test mode, copy and save it to enjoy `free unlimited API calls`.
    <br />3- Select the right server in which you have created your API key.
    <br /> 4- Now click <b>`Authorize`</b> button, and paste the API key into `bearerAuth  (http, Bearer)` text box.
    <br /> 5- Click again the `Authorize` button to complete authorization process. Click `Close` to execute the API calls.
servers:
  - url: https://api-testnet.truvera.io
    description: Sandbox server (uses test data)
  - url: https://api.truvera.io
    description: Production server (uses live data)
tags:
  - name: dids
    description: Operations about DIDs
  - name: credentials
    description: Operations about Credentials
  - name: presentations
    description: Operations about Presentations and Proof Requests
  - name: registries
    description: Operations about Registries
  - name: revocationStatus
    description: Operations about Revocation Status
  - name: delegatableRevocation
    description: Operations about Delegatable Credential Revocation
  - name: schemas
    description: Operations about Schemas
  - name: delegationRules
    description: Operations about Delegation Rules
  - name: jobs
    description: Operations about Jobs
  - name: profiles
    description: Operations about Profiles
  - name: webhooks
    description: Operations about Webhooks
  - name: templates
    description: Operations about Templates
  - name: subaccounts
    description: Operations about Subaccounts
  - name: teams
    description: Operations about Teams
  - name: messaging
    description: Operations about DIDComm messaging
  - name: openid
    description: Operations about OpenID
  - name: trustRegistries
    description: Operations about trust registries
  - name: data
    description: Operations relating to your own account data
  - name: openid-holder
    description:
      Routes used by a wallet application to receive/present OpenID credentials, not used directly
      by an API user
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    accessToken:
      type: apiKey
      in: header
      name: DOCK-API-TOKEN
    nextAuth:
      type: apiKey
      in: header
      name: CERTS-TOKEN
    sponsorKey:
      type: apiKey
      in: header
      name: X-MOBILE-SPONSOR-KEY
    didKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    null_type:
      title: 'OpenAPI 3.0 null-type ref'
      description: 'for adding nullability to a ref'
      enum: [null]
    DelegationRulePolicyDocument:
      type: object
      additionalProperties: true
      description:
        Delegation policy document payload (validated server-side against DelegationPolicy schema)
    DelegationRuleSet:
      type: object
      required:
        - id
        - name
        - createdAt
        - policy
        - schemaIds
      properties:
        id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
          maxLength: 256
          description: Human-readable delegation ruleset name
        createdAt:
          type: string
          format: date
        policy:
          $ref: '#/components/schemas/DelegationRulePolicyDocument'
        schemaIds:
          type: array
          items:
            type: string
        created:
          type: string
          format: date-time
        updated:
          type: string
          format: date-time
    DelegationRulesRequest:
      type: object
      required:
        - name
        - policy
        - schemaIds
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 256
          description: Human-readable delegation ruleset name
        policy:
          $ref: '#/components/schemas/DelegationRulePolicyDocument'
        schemaIds:
          type: array
          minItems: 1
          items:
            type: string
    DelegationRulesList:
      type: array
      items:
        $ref: '#/components/schemas/DelegationRuleSet'
    DelegationReport:
      type: object
      description: Delegation context for presented credentials issued under a delegation policy
      properties:
        requirements:
          type: array
          items:
            type: object
            properties:
              descriptorId:
                type: string
                nullable: true
              schemaId:
                type: string
                nullable: true
              requireIssuer:
                type: boolean
              issuer:
                type: string
                nullable: true
              role:
                type: string
                nullable: true
              capabilityGrants:
                type: object
                additionalProperties: true
        chains:
          type: array
          items:
            type: object
            properties:
              credentialId:
                type: string
                nullable: true
              delegationPolicyId:
                type: string
              policy:
                type: object
                nullable: true
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  version:
                    type: string
                    format: date
                    nullable: true
                  ruleset:
                    type: object
                    additionalProperties: true
              resolved:
                type: boolean
              roleId:
                type: string
                nullable: true
              roleLabel:
                type: string
                nullable: true
              roleInferred:
                type: boolean
              grantedCapabilities:
                type: array
                items:
                  type: object
                  properties:
                    capability:
                      type: string
                    schema:
                      type: object
                      additionalProperties: true
                      nullable: true
              constraints:
                type: object
                additionalProperties: true
                nullable: true
              delegatedAttributes:
                type: array
                items:
                  type: object
                  properties:
                    path:
                      type: string
                    value: {}
              chainRefs:
                type: object
                properties:
                  rootCredentialId:
                    type: string
                    nullable: true
                  previousCredentialId:
                    type: string
                    nullable: true
        context:
          type: object
          properties:
            verifierDID:
              type: string
              nullable: true
            verifierName:
              type: string
              nullable: true
            verifierLogo:
              type: string
              nullable: true
            requestedAt:
              type: string
              format: date-time
              nullable: true
            nonce:
              type: string
              nullable: true
    DelegatableRevocationControlRequest:
      type: object
      required:
        - action
      properties:
        action:
          type: string
          enum:
            - create
            - revoke
            - unrevoke
        registryId:
          $ref: '#/components/schemas/Hex32'
        credentialId:
          type: string
          description: Required for revoke and unrevoke actions.
        statusListIndex:
          type: integer
          minimum: 0
          maximum: 131071
          description: Required for revoke and unrevoke actions.
    DelegatableRevocationControlResponse:
      type: object
      properties:
        registryId:
          type: string
        action:
          type: string
          enum:
            - create
            - revoke
            - unrevoke
        credentialId:
          type: string
        statusListCredential:
          type: string
          format: uri
    DelegatableStatusList2021Credential:
      type: object
      required:
        - '@context'
        - id
        - type
        - issuer
        - credentialSubject
      properties:
        '@context':
          type: array
          items:
            oneOf:
              - type: string
              - type: object
                additionalProperties: true
        id:
          type: string
          format: uri
        type:
          type: array
          items:
            type: string
        issuer:
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
        issuanceDate:
          type: string
          format: date-time
        credentialSubject:
          type: object
          required:
            - id
            - type
            - statusPurpose
            - encodedList
          properties:
            id:
              type: string
              format: uri
            type:
              type: string
            statusPurpose:
              type: string
              enum:
                - revocation
            encodedList:
              type: string
    OID4VPRequestCreate:
      properties:
        withIdToken:
          type: boolean
          default: false
        withRequestURI:
          type: boolean
          default: false
    UserProfile:
      required:
        - image
        - name
      properties:
        name:
          type: string
          maxLength: 256
        image:
          type: string
          maxLength: 2048
    TrustRegistryQueryRequest:
      type: object
      properties:
        verifierDID:
          $ref: '#/components/schemas/DID'
        issuerDID:
          $ref: '#/components/schemas/DID'
        schema:
          type: string
    TrustRegistryCreateRequest:
      type: object
      required:
        - convener
        - name
        - description
        - logoUrl
        - ecosystemUrl
        - governanceFramework
        - governanceFrameworkVersion
      properties:
        convener:
          $ref: '#/components/schemas/DID'
        name:
          type: string
          description: Trust registry name
          maxLength: 256
          example: 'Truvera Example Ecosystem'
        description:
          type: string
          description: Trust registry description
          maxLength: 2000
          example: 'Labore voluptate adipisicing magna duis eu fugiat pariatur excepteur irure.'
        logoUrl:
          type: string
          format: uri
          maxLength: 2048
          example: https://logo.truvera.io/trust-registry
        ecosystemUrl:
          type: string
          format: uri
          maxLength: 2048
          example: https://ecosystem.truvera.io
        governanceFramework:
          type: string
          description: Trust registry governance framework
          maxLength: 5000
          example: 'Lorem ea ea reprehenderit cupidatat minim incididunt occaecat est sit.'
        governanceFrameworkVersion:
          type: string
          description: Trust registry governance framework version
          maxLength: 64
          example: '1.0.0'
    TrustRegistryUpdateRequest:
      type: object
      required:
        - name
        - description
        - logoUrl
        - ecosystemUrl
        - governanceFramework
        - governanceFrameworkVersion
      properties:
        name:
          type: string
          description: Trust registry name
          maxLength: 256
          example: 'Truvera Example Ecosystem'
        description:
          type: string
          description: Trust registry description
          maxLength: 2000
          example: 'Labore voluptate adipisicing magna duis eu fugiat pariatur excepteur irure.'
        logoUrl:
          type: string
          description: Trust registry logo URL
          format: uri
          maxLength: 2048
          example: https://logo.truvera.io/trust-registry
        ecosystemUrl:
          type: string
          description: Trust registry ecosystem URL
          format: uri
          maxLength: 2048
          example: https://ecosystem.truvera.io
        governanceFramework:
          type: string
          description: Trust registry governance framework
          maxLength: 5000
          example: 'Lorem ea ea reprehenderit cupidatat minim incididunt occaecat est sit.'
        governanceFrameworkVersion:
          type: string
          description: Trust registry governance framework version
          maxLength: 64
          example: '1.0.0'
    TrustRegistry:
      type: object
      required:
        - id
        - convener
        - name
        - description
        - created
        - logoUrl
        - ecosystemUrl
        - governanceFramework
        - governanceFrameworkVersion
      properties:
        id:
          type: string
          description: Trust registry ID
          example: '0x601d148fb8895aca83eafb264293069911f76805b748b014ae64fcf0fd2d765d'
        convener:
          $ref: '#/components/schemas/DID'
        convenerName:
          type: string
          description: Convener name
          example: 'Truvera'
        convenerLogoUrl:
          type: string
          description: Convener logo URL
          example: 'https://logo.truvera.io/convener'
        slug:
          type: string
          description: Trust registry slug
          example: 'truvera-example-ecosystem-1'
        nonce:
          type: string
          description: Trust registry nonce
          example: '0x57aecb3863404812'
        created:
          type: string
          format: date-time
        name:
          type: string
          description: Trust registry name
          example: 'Truvera Example Ecosystem'
        description:
          type: string
          description: Trust registry description
          example: 'Labore voluptate adipisicing magna duis eu fugiat pariatur excepteur irure.'
        logoUrl:
          type: string
          description: Trust registry logo URL
          format: uri
          maxLength: 2048
          example: https://logo.truvera.io/trust-registry
        ecosystemUrl:
          type: string
          description: Trust registry ecosystem URL
          format: uri
          maxLength: 2048
          example: https://ecosystem.truvera.io
        governanceFramework:
          type: string
          description: Trust registry governance framework
          example: 'Lorem ea ea reprehenderit cupidatat minim incididunt occaecat est sit.'
        governanceFrameworkVersion:
          type: string
          description: Trust registry governance framework version
          example: '1.0.0'
        issuerCount:
          type: integer
          description: Trust registry issuer count
          example: 10
        verifierCount:
          type: integer
          description: Trust registry verifier count
          example: 5
    TrustRegistries:
      type: array
      items:
        $ref: '#/components/schemas/TrustRegistry'
    TrustRegistryInviteAcceptRequest:
      type: object
      required:
        - token
        - did
        - infoUrl
      properties:
        token:
          type: string
          description: The invite token
          maxLength: 4096
          example: 'eyJhbGc...2VVqUw'
        did:
          $ref: '#/components/schemas/DID'
        infoUrl:
          anyOf:
            - type: string
              description: Trust registry participant info URL
              format: uri
              maxLength: 2048
            - type: string
              description: Trust registry participant info URL
              enum: ['']
          example: https://info.truvera.io/trust-registry/participant/1234
    TrustRegistryInviteRequest:
      type: object
      properties:
        maxAge:
          type: integer
          description: Max age of the invite in seconds
        issuerSchemas:
          type: array
          items:
            type: string
            description: Trust registry issuer schema
            example: 'https://schema.truvera.io/ExampleSchema-V5-1722512884923.json'
        verifierSchemas:
          type: array
          items:
            type: string
            description: Trust registry verifier schema
            example: 'https://schema.truvera.io/ExampleSchema-V5-1722512884923.json'
    TrustRegistryInviteResponse:
      type: object
      required:
        - link
      properties:
        link:
          type: string
          description: The trust registry invite link
          example: 'https://trust-registry.truvera.io/ecosystems?token=eyJhbGc...2VVqUw'
    TrustRegistryParticipant:
      type: object
      required:
        - id
        - name
        - did
      properties:
        id:
          type: string
          description: Trust registry participant ID
          example: '23314808-eec6-4492-9a8a-8f32e34b8155'
        name:
          type: string
          description: Trust registry participant name
          example: 'Truvera Issuer'
        did:
          $ref: '#/components/schemas/DID'
        description:
          type: string
          description: Trust registry participant description
          example: 'Labore voluptate adipisicing magna duis eu fugiat pariatur excepteur irure.'
        logoUrl:
          anyOf:
            - type: string
              description: Trust registry participant logo URL
              format: uri
              maxLength: 2048
            - type: string
              description: Trust registry participant logo URL
              enum: ['']
          example: https://logo.truvera.io/participant
        infoUrl:
          anyOf:
            - type: string
              description: Trust registry participant info URL
              format: uri
              maxLength: 2048
            - type: string
              description: Trust registry participant info URL
              enum: ['']
          example: https://info.truvera.io/trust-registry/participant/1234
        status:
          type: string
          description: Trust registry participant status
          example: 'active'
          enum: [active, suspended]
        role:
          type: string
          description: Trust registry participant role
          example: 'issuer'
          enum: [verifier+issuer, issuer, verifier]
        created:
          type: string
          format: date-time
        suspendedAt:
          type: string
        issuerSchemas:
          type: array
          items:
            type: string
            description: Trust registry participant issuer schema
            example: 'https://schema.truvera.io/ExampleSchema-V5-1722512884923.json'
        verifierSchemas:
          type: array
          items:
            type: string
            description: Trust registry participant verifier schema
            example: 'https://schema.truvera.io/ExampleSchema-V5-1722512884923.json'
    TrustRegistryParticipantPatch:
      type: object
      properties:
        name:
          type: string
          description: Trust registry participant name
          maxLength: 256
          example: 'Truvera Issuer'
        logoUrl:
          type: string
          description: Trust registry participant logo URL
          format: uri
          maxLength: 2048
          example: https://logo.truvera.io/trust-registry-participant/1234
        infoUrl:
          anyOf:
            - type: string
              description: Trust registry participant info URL
              format: uri
              maxLength: 2048
            - type: string
              description: Trust registry participant info URL
              enum: ['']
          example: https://info.truvera.io/trust-registry/participant/1234
        status:
          type: string
          description: Trust registry participant status
          example: 'active'
          enum: [active, suspended]
        suspendedAt:
          type: string
          maxLength: 64
        issuerSchemas:
          type: array
          items:
            type: string
            description: Trust registry participant issuer schema
            example: 'https://schema.truvera.io/ExampleSchema-V5-1722512884923.json'
        verifierSchemas:
          type: array
          items:
            type: string
            description: Trust registry participant verifier schema
            example: 'https://schema.truvera.io/ExampleSchema-V5-1722512884923.json'
    TrustRegistryParticipantInfoPatch:
      type: object
      properties:
        infoUrl:
          anyOf:
            - type: string
              description: Trust registry participant info URL
              format: uri
              maxLength: 2048
            - type: string
              description: Trust registry participant info URL
              enum: ['']
          example: https://info.truvera.io/trust-registry/participant/1234
    TrustRegistryParticipants:
      type: object
      required:
        - total
        - list
      properties:
        total:
          type: integer
          description: Total number of participants
          example: 42
        list:
          type: array
          items:
            $ref: '#/components/schemas/TrustRegistryParticipant'
    TrustRegistrySchema:
      type: object
      required:
        - id
        - name
        - participantCount
        - topParticipants
        - public
      properties:
        id:
          type: string
          description: Trust registry schema ID
          example: 'https://schema.truvera.io/ExampleSchema-V5-1722512884923.json'
        name:
          type: string
          description: Trust registry schema name
          example: 'Example Schema'
        public:
          type: boolean
          description: Whether the schema is currently public (i.e. can be verified by anyone).
        participantCount:
          type: integer
          description: How many participants have this schema assigned
          example: 10
        prices:
          type: array
          description: Prices assigned to this schema
          items:
            $ref: '#/components/schemas/TrustRegistrySchemaPrice'
        topParticipants:
          type: array
          description: Top participants that have this schema assigned
          items:
            $ref: '#/components/schemas/TrustRegistryParticipant'
    TrustRegistrySchemaPrice:
      type: object
      required:
        - currency
        - digits
      properties:
        currency:
          type: string
          description: Currency code
          maxLength: 8
          example: USD
        digits:
          description:
            Bigint representation of the price. Multiply by 1,000,000 to support fractional cents.
          oneOf:
            - type: integer
            - type: string
          example: 100000000
        verifier:
          $ref: '#/components/schemas/DID'
    TrustRegistryReport:
      type: object
      required:
        - verifierDID
        - issuerDID
        - schemaId
        - currency
        - verifierFee
        - vendorFee
        - created
      properties:
        trustRegistryId:
          description: Trust registry ID
          type: string
          example: '0x601d148fb8895aca83eafb264293069911f76805b748b014ae64fcf0fd2d765d'
        verificationId:
          description: Verification ID
          type: string
          example: 798e9e9f-9a73-4bd3-881f-367e1d1c70ee
        verificationTemplateId:
          description: Verification Template ID
          type: string
          example: d0194072-b706-485d-bc5a-02a433641f63
        isValid:
          description: Was the verification successful with valid credentials
          type: boolean
          example: true
        verifierDID:
          $ref: '#/components/schemas/DID'
        issuerDID:
          $ref: '#/components/schemas/DID'
        schemaId:
          description: Schema ID
          type: string
          example: https://schema.truvera.io/ExampleSchema-V5-1722512884923.json
        currency:
          description: Currency code
          type: string
          example: USD
        verifierFee:
          description: Verifier fee
          type: string
          example: 123456
        vendorFee:
          description: Vendor fee
          type: string
          example: 6172
        created:
          type: string
          format: date-time
    TrustRegistryReports:
      type: object
      required:
        - total
        - list
      properties:
        total:
          type: integer
        list:
          type: array
          items:
            $ref: '#/components/schemas/TrustRegistryReport'
    TrustRegistrySchemas:
      type: object
      required:
        - total
        - list
      properties:
        total:
          type: integer
          description: Total number of schemas
          example: 200
        list:
          type: array
          items:
            $ref: '#/components/schemas/TrustRegistrySchema'
    TrustRegistryProofTemplateAssignRequest:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          description: The proof template ID
          example: a6cd414a-6eba-4241-9a9c-6f75864edbd5
    TrustRegistryProofTemplates:
      type: object
      required:
        - total
        - list
      properties:
        total:
          type: integer
          description: Total number of proof templates
          example: 200
        list:
          type: array
          items:
            $ref: '#/components/schemas/ProofRequest'
    TrustRegistryPublic:
      type: object
      required:
        - id
        - name
        - logoUrl
        - ecosystemUrl
      properties:
        id:
          type: string
          description: The unique identifier for the ecosystem, usually a hash value.
          example: '0xe7e0f253c5f05059904109e33fb63b104edddd7e114a8746a5faf07a944d58aa'
        slug:
          type: string
          description:
            A human-readable identifier for the ecosystem, used as a URL path or reference name.
          example: 'truvera-ecosystem-419'
        convener:
          type: string
          description:
            The DID of the convener or owner of the ecosystem, responsible for its management.
          example: 'did:cheqd:testnet:ac2b9027-ec1a-4ee2-aad1-1e316e7d6f59'
        created:
          type: string
          format: date-time
          description: The date and time when the ecosystem was created.
          example: '2024-09-26T13:18:51.534Z'
        name:
          type: string
          description: The name of the ecosystem.
          example: 'Truvera Ecosystem'
        description:
          type: string
          description: A brief description of the ecosystem.
          example: 'This is my new awesome ecosystem!'
        logoUrl:
          type: string
          format: uri
          maxLength: 2048
          description: A URL pointing to the logo image of the ecosystem.
          example: https://logo.truvera.io/trust-registry
        ecosystemUrl:
          type: string
          format: uri
          maxLength: 2048
          description: The main website URL of the ecosystem.
          example: https://ecosystem.truvera.io
        governanceFramework:
          type: string
          description: A markdown document describing the governance framework of the ecosystem.
          example: 'This is a markdown document describing my framework'
        governanceFrameworkVersion:
          type: string
          description: The version of the governance framework.
          example: '1.0.0'
        participantRole:
          type: string
          description:
            The role of the participant within the ecosystem, such as 'verifier' or 'issuer'.
          example: 'verifier'
        participantStatus:
          type: string
          description: The current status of the participant in the ecosystem.
          example: 'active'
        participantName:
          type: string
          description: The name of the participant in the ecosystem.
          example: 'My Convener'
        participantLogoUrl:
          type: string
          format: uri
          maxLength: 2048
          description: A URL pointing to the logo image of the participant.
          example: https://logo.com/participant
        participantInfoUrl:
          anyOf:
            - type: string
              format: uri
              maxLength: 2048
              description: A URL providing additional information about the participant.
              example: https://participant.truvera.io
            - type: string
              enum: ['']
    TrustRegistryPublicList:
      type: object
      required:
        - total
        - list
      properties:
        total:
          type: integer
        list:
          type: array
          items:
            $ref: '#/components/schemas/TrustRegistryPublic'
    TrustRegistryGenericSchemaPrice:
      type: object
      required:
        - currency
        - digits
        - trustRegistryId
        - trustRegistryMetadata
      properties:
        currency:
          type: string
          description: Currency code
          example: USD
        digits:
          description:
            Bigint representation of the price. Multiply by 1,000,000 to support fractional cents.
          oneOf:
            - type: integer
            - type: string
          example: 100000000
        trustRegistryId:
          description: Trust registry ID
          type: string
          example: '0x601d148fb8895aca83eafb264293069911f76805b748b014ae64fcf0fd2d765d'
        trustRegistryMetadata:
          type: object
          description: Trust registry metadata
          properties:
            name:
              type: string
              description: Trust registry name
              example: Example Trust Registry
            logoUrl:
              type: string
              description: Trust registry logo URL
              format: uri
              maxLength: 2048
              example: https://logo.truvera.io/trust-registry
            description:
              type: string
              description: Trust registry description
              example: Example Trust Registry Description
            ecosystemUrl:
              type: string
              description: Trust registry ecosystem URL
              format: uri
              maxLength: 2048
              example: https://ecosystem.truvera.io
            governanceFramework:
              type: string
              description: Trust registry governance framework
              example: Example Governance Framework
            governanceFrameworkVersion:
              type: string
              description: Trust registry governance framework version
              example: 1.0
    ListOfDIDs:
      description: List of DID strings
      type: array
      items:
        type: string
    TrustRegistryGenericSchemaPrices:
      description: Trust registry schema prices
      type: array
      items:
        type: object
        properties:
          schema:
            type: string
            description: The schema ID
            example: https://schema.truvera.io/ExampleSchema-V5-1722512884923.json
          prices:
            type: array
            items:
              $ref: '#/components/schemas/TrustRegistryGenericSchemaPrice'
    TrustRegistryGenericSchemaDids:
      description: Trust registry schema dids
      type: array
      items:
        type: object
        properties:
          schema:
            type: string
            description: The schema ID
            example: https://schema.truvera.io/ExampleSchema-V5-1722512884923.json
          dids:
            type: array
            items:
              $ref: '#/components/schemas/DID'
    CredentialIssueRequest:
      type: object
      required:
        - credential
      properties:
        persist:
          type: boolean
          default: false
          description:
            Whether to store an encrypted version of this credential with us. Defaults to false, if
            true you must supply password. When choosing to persist a credential containing
            Personally Identifiable Information (PII), consider the implications for data storage
            regulatory compliance.
          example: false
        password:
          type: string
          maxLength: 32
          minLength: 4
          description:
            Password used to encrypt the credential if you choose to store it. The same password
            must be used to retrieve the credential contents. Truvera does not store this password.
          example: ''
        anchor:
          type: boolean
          default: false
          description: Anchor the credential on the blockchain or not
          example: false
          deprecated: true
        template:
          type: string
          format: uuid
          description:
            The credential template UUID, only required for PDF and web rendering customization
          example: ''
        recipientDID:
          type: string
          maxLength: 512
          description:
            The holder's DID for DID distribution, optional. Not required for OpenID flows.
          example: ''
        recipientEmail:
          type: string
          maxLength: 256
          description:
            The holder's email for email distribution, optional. Not required for OpenID flows.
          example: ''
        algorithm:
          type: string
          maxLength: 32
          minLength: 4
          description:
            Optional. Specifies which signing algorithm to use to sign the issued credential.
            Defaults to ed25519 for jsonld/jwt and secp256r1 (ES256) for sdjwt. For ZKP credentials
            use dockbbs. If omitted and the credential references a Truvera schema with
            `$metadata.variant`, the value from the schema is used.
          example: 'dockbbs'
        distribute:
          type: boolean
          default: false
          description:
            Whether to distribute the credential or not based on subject DID or email address. Not
            required for OpenID flows.
          example: false
        format:
          type: string
          enum: [jsonld, jwt, sdjwt]
          description:
            Specifies the output format of the credential, either jsonld, jwt or sdjwt. Defaults to
            jsonld. If omitted and the credential references a Truvera schema with
            `$metadata.variant`, the value from the schema is used.
          example: 'jsonld'
        credential:
          $ref: '#/components/schemas/Credential'
        revocable:
          type: boolean
          description:
            Whether the credential can be revoked or not. If true the revocation registry will be
            automatically provisioned. If omitted and the credential references a Truvera schema
            with `$metadata.variant`, the value from the schema is used; otherwise the credential is
            not revocable.
          example: true
    DIDCommMessage:
      description: A DIDComm message with metadata
      type: object
      properties:
        messageId:
          type: string
          description: Unique identifier for the message
          example: 'msg_1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef'
        to:
          type: string
          description: The DID that received this message
          example: 'did:cheqd:testnet:ac2b9027-ec1a-4ee2-aad1-1e316e7d6f59'
        messageType:
          type: string
          description: The type of the message (from the message content)
          example: 'https://didcomm.org/basicmessage/2.0/basic-message'
        sender:
          type: string
          nullable: true
          description: The DID of the message sender (if available)
          example: 'did:example:sender'
        receivedAt:
          type: string
          format: date-time
          description: When the message was received
          example: '2024-01-15T10:30:01Z'
        content:
          type: object
          description:
            The message content (decrypted if encrypted, plaintext if not). Not included in message
            lists.
          additionalProperties: true
      required:
        - messageId
        - to
        - receivedAt
    Error:
      description: An API Error
      type: object
      properties:
        status:
          type: integer
        type:
          type: string
        message:
          type: string
    Hex32:
      description: 32 byte hex string. Ignoring higher base (base64) for simplicity.
      type: string
      minLength: 64
      maxLength: 64
      pattern: '^[0-9a-fA-F]{64}$'
    JobStartedResult:
      description:
        Object containing unique id of the background task and associated data. This id can be used
        to query the job status
      properties:
        id:
          type: string
        data:
          type: object
    JobId:
      description: Unique id of the background task. This id can be used to query the job status
      type: string
      example: '900'
    JobStatus:
      description: Status of the job.
      type: string
      enum: [todo, finalized, in_progress, error]
    JobDesc:
      description: Description of the job including result if available
      properties:
        id:
          $ref: '#/components/schemas/JobId'
        status:
          $ref: '#/components/schemas/JobStatus'
        result:
          type: object
    DID:
      description: DID as fully qualified, typically. `did:cheqd:`
      type: string
      maxLength: 512
      example: did:cheqd:testnet:ac2b9027-ec1a-4ee2-aad1-1e316e7d6f59
    NumericID:
      description: A unique numeric ID
      type: string
      maxLength: 64
      pattern: '^[0-9]+$'
    URI:
      description: Valid URI
      type: string
      format: uri
      minLength: 8
      maxLength: 2048
      example: https://credentials.truvera.io/1234
    KeyType:
      description:
        'Type of public key for DID (NOTE: secp256k1, sr25519 are deprecated; secp256r1 is supported
        for ES256/JWK flows)'
      type: string
      enum:
        - ed25519
        - bjj
        - secp256r1
        - secp256k1
        - sr25519
    SigType:
      description:
        'Type of signature (NOTE: EcdsaSecp256k1Signature2019, Sr25519Signature2020 are deprecated)'
      type: string
      enum:
        - Ed25519Signature2018
        - Ed25519Signature2020
        - Bls12381BBS+SignatureDock2022
        - Bls12381BBS+SignatureProofDock2022
        - Bls12381BBDT16MACDock2024
        - Bls12381BBSSignatureDock2023
        - Bls12381BBSVerificationKeyDock2023
        - BJJSignature2021
        - EcdsaSecp256k1Signature2019
        - Sr25519Signature2020
    ProofPurpose:
      description: Purpose of credential
      type: string
      enum:
        - assertionMethod
        - authentication
    Context:
      description: JSON-LD context array of strings or single string
      example: 'https://docknetwork.github.io/vc-schemas/basic-credential.json-ld'
      oneOf:
        - type: array
          items:
            oneOf:
              - type: string
              - type: object
        - type: string
    DIDDoc:
      description:
        A DID Document containing information about a decentralized identifier (DID) and its
        associated entities.
      type: object
      properties:
        '@context':
          $ref: '#/components/schemas/Context'
        id:
          $ref: '#/components/schemas/DID'
        authentication:
          type: array
          description: Array of verification methods used for authentication.
          items:
            oneOf:
              - type: object
              - type: string
          example:
            - 'did:cheqd:testnet:ac2b9027-ec1a-4ee2-aad1-1e316e7d6f59#keys-1'
        assertionMethod:
          type: array
          description: Array of verification methods used for assertion.
          items:
            oneOf:
              - type: object
              - type: string
          example:
            - 'did:cheqd:testnet:ac2b9027-ec1a-4ee2-aad1-1e316e7d6f59#keys-1'
        capabilityInvocation:
          type: array
          description: Array of verification methods used for capability invocation.
          items:
            oneOf:
              - type: object
              - type: string
          example:
            - 'did:cheqd:testnet:ac2b9027-ec1a-4ee2-aad1-1e316e7d6f59#keys-1'
        publicKey:
          type: array
          description: Array of public keys associated with the DID document.
          items:
            type: object
            properties:
              id:
                type: string
                description: The unique identifier for the public key.
                example: 'did:cheqd:testnet:ac2b9027-ec1a-4ee2-aad1-1e316e7d6f59#keys-1'
              type:
                type: string
                description: The type of the public key.
                example: 'Sr25519VerificationKey2020'
              controller:
                type: string
                description: The DID that controls the key.
                example: 'did:cheqd:testnet:ac2b9027-ec1a-4ee2-aad1-1e316e7d6f59'
              publicKeyBase58:
                type: string
                description: The public key encoded in base58 format.
                example: 'Cs8XUWkpkscPhEVCsUAicLqd8pL2MoGqahywfRhbtVEi'
    DIDsResponse:
      description: Response containing a list of DIDs
      type: array
      items:
        type: object
        properties:
          id:
            $ref: '#/components/schemas/DID'
          did:
            $ref: '#/components/schemas/DID'
          type:
            type: string
            description: The type of DID, indicating the network or method used.
            enum:
              - cheqd
              - key
              - dock
            example: 'cheqd'
          controller:
            description: The controller of the DID, who has authority over it.
            $ref: '#/components/schemas/DID'
          credentialCount:
            type: string
            description: The number of credentials issued by this DID.
            example: '0'
          updatedLast:
            type: string
            format: date-time
            description: The timestamp of the last update to the DID metadata.
            example: '2024-09-26T12:38:10.871Z'
          profile:
            description:
              Additional profile information associated with the DID, such as a public profile or
              other descriptive metadata.
            type: object
            nullable: true
            properties:
              name:
                type: string
                description: The name associated with the profile.
                example: 'My Convener'
              logo:
                anyOf:
                  - type: string
                    maxLength: 0
                  - type: string
                    format: uri
                    description: A URL pointing to the logo image associated with the profile.
                    example: 'https://logo.truvera.io/convener.png'
              description:
                type: string
                description: A brief description of the profile.
                example: 'An ecosystem convener'
          keyId:
            type: string
            description: The identifier of the key associated with the DID.
            example: 'did:cheqd:testnet:f48d2ace-4947-4cb7-8550-1cef3d63e651#keys-1'
          jobId:
            anyOf:
              - $ref: '#/components/schemas/null_type'
              - $ref: '#/components/schemas/JobId'
          trustRegistries:
            type: array
            description: A list of trust registries associated with this DID.
            items:
              type: object
              properties:
                id:
                  type: string
                  description: The unique identifier of the trust registry.
                  example: '0x592a...c99b'
                name:
                  type: string
                  description: The name of the trust registry.
                  example: 'Updated Name'
                logoUrl:
                  type: string
                  format: uri
                  description: A URL pointing to the logo image of the trust registry.
                  example: 'https://logo.com/ecosystemnew'
    Credential:
      description: Format to create credentials with the API
      type: object
      properties:
        id:
          type: string
          maxLength: 512
          description:
            Optional credential ID, ideally as a URI or UUID. Leave blank to auto generate
          example: ''
        previousCredentialId:
          type: string
          maxLength: 512
          description:
            Optional credential ID that denotes the previous credential in the delegation chain
          example: ''
        rootCredentialId:
          type: string
          maxLength: 512
          description: Optional credential ID that denotes the delegation root
          example: ''
        name:
          type: string
          maxLength: 256
          example: 'Basic Credential'
          description: Optional name to be inserted in the credential
        description:
          type: string
          maxLength: 2000
          example: 'My first credential'
          description: Optional description to be inserted in the credential
        schema:
          example: 'https://docknetwork.github.io/vc-schemas/basic-credential.json'
          oneOf:
            - type: object
            - type: string
              format: uri
        context:
          $ref: '#/components/schemas/Context'
        type:
          example: [BasicCredential]
          description: Custom type, leave empty to auto generate where possible
          type: array
          items:
            type: string
        subject:
          example:
            id: did:key:z6MkqBcwvYurNSSqyBkxavv4fkaq2iu3v3YGMbdyfa4bVNxD
            name: A. Holder
          oneOf:
            - type: object
            - type: array
        issuer:
          oneOf:
            - type: string
              $ref: '#/components/schemas/DID'
            - type: object
        issuanceDate:
          type: string
          format: date-time
        expirationDate:
          type: string
          format: date-time
          example: '2030-09-20T00:13:59.270Z'
        status:
          description: Revocation registry id or user supplied status object
          example: null
          oneOf:
            - type: object
            - type: string
    Team:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
          description: The team ID
        team_owner_id:
          type: integer
          description: The team owner ID
        owner_user_id:
          type: integer
          description: The workspace user account that currently owns the team (transferable)
          nullable: true
        name:
          type: string
          description: The team name
          nullable: true
        organization_name:
          type: string
          description: The organization name for the team (customer entity)
          nullable: true
        billing_email:
          type: string
          description: The billing email for the team
          nullable: true
    TeamMember:
      type: object
      required:
        - id
        - name
      properties:
        id:
          description: The team member ID
          type: integer
        name:
          description: The team member name
          type: string
        email:
          description: The team member email
          type: string
        image:
          description: The team member image
          type: string
        role:
          description: The team member role
          type: string
          enum: ['member', 'administrator', 'owner']
    Notification:
      type: object
      required:
        - type
        - data
        - created
      properties:
        type:
          description: The type of the notification
          type: string
        data:
          description: The data of the notification, varies depending on type
          type: object
        created:
          description: The datetime of the notification
          type: string
          format: date-time
    Notifications:
      type: object
      required:
        - total
        - list
      properties:
        total:
          description: The total number of records
          type: integer
        list:
          description: The current paged records
          type: array
          items:
            $ref: '#/components/schemas/Notification'
    TeamMembers:
      type: array
      items:
        $ref: '#/components/schemas/TeamMember'
    TeamMemberInvitation:
      type: object
      required:
        - id
        - email
      properties:
        id:
          description: The team member invitation ID
          type: integer
        email:
          description: The team member invitation email
          type: string
        status:
          description: The team member invitation status
          type: string
          enum: ['pending', 'accepted', 'canceled']
    TeamMemberInvitations:
      type: array
      items:
        $ref: '#/components/schemas/TeamMemberInvitation'
    EncryptedWallet:
      description: An encrypted Universal Wallet JSON-LD document
      type: object
      properties:
        '@context':
          type: array
          items:
            type: string
          description: The context defining the terms used in the credential
          example:
            - 'https://www.w3.org/2018/credentials/v1'
            - 'https://w3id.org/wallet/v1'
        id:
          type: string
          description: The ID of the credential, typically a DID with a fragment identifier
          example: 'did:key:z6LS...Wa19#encrypted-wallet'
        type:
          type: array
          items:
            type: string
          description:
            The type of the credential, includes VerifiableCredential and other specific types
          example:
            - 'VerifiableCredential'
            - 'EncryptedWallet'
        issuer:
          type: string
          description: The issuer of the credential, typically a DID
          example: 'did:key:z6LS...Wa19'
        issuanceDate:
          type: string
          format: date-time
          description: The date and time the credential was issued
          example: '2024-09-26T12:08:18.803Z'
        credentialSubject:
          type: object
          description: The subject of the credential, containing encrypted wallet contents
          properties:
            id:
              type: string
              description: The ID of the credential subject, typically a DID
              example: 'did:key:z6LS...Wa19'
            encryptedWalletContents:
              type: object
              description: The encrypted contents of the wallet
              properties:
                protected:
                  type: string
                  description: The protected header of the encrypted wallet
                  example: 'eyJlbmMiOiJYQzIwUCJ9'
                recipients:
                  type: array
                  items:
                    type: object
                    description: List of recipients who can decrypt the wallet
                    properties:
                      encrypted_key:
                        type: string
                        description: The encrypted key for the recipient
                        example: 'OHwaAnWZThM_lGP-9g_zBSBhbRjOeFEG4LsvTEA5V-5WW63J--Xw4w'
                      header:
                        type: object
                        description: The header information for the recipient
                        properties:
                          kid:
                            type: string
                            description: Key ID of the recipient
                            example: 'did:key:z6LS...Wa19#z6LS...Wa19'
                          alg:
                            type: string
                            description: Algorithm used for encryption
                            example: 'ECDH-ES+A256KW'
                          epk:
                            type: object
                            description: Ephemeral public key used for encryption
                            properties:
                              kty:
                                type: string
                                description: Key type
                                example: 'OKP'
                              crv:
                                type: string
                                description: Curve type
                                example: 'X25519'
                              x:
                                type: string
                                description: Public key value
                                example: '4xA5LWWdfhLed5AUvHPsDAYaxhsMdV4UBw1kN0As1Hs'
                          apu:
                            type: string
                            description: Agreement PartyU Info
                            example: '4xA5LWWdfhLed5AUvHPsDAYaxhsMdV4UBw1kN0As1Hs'
                          apv:
                            type: string
                            description: Agreement PartyV Info
                            example: 'ZGlkOmtleTp6NkxTaFZ0VlJiUlA4REFoZm05ODFyQ244WWhNVFBhZzlWNFNNakN...'
                iv:
                  type: string
                  description: The initialization vector for the encryption
                  example: 'NyMwyU-0QGnaqRVy0u0_Ilae3ETvcZq_'
                ciphertext:
                  type: string
                  description: The encrypted data
                  example: 8MJvLT..._wYO54
                tag:
                  type: string
                  description: Authentication tag for the encrypted wallet
                  example: 'b-fL728NLEZkqz5SEIMI8Q'
    UnsignedVerifiablePresentation:
      description: Verifiable Presentation that is unsigned
      type: object
      properties:
        '@context':
          $ref: '#/components/schemas/Context'
        id:
          type: string
          format: uri
        type:
          type: array
          items:
            type: string
        verifiableCredential:
          oneOf:
            - type: object
              $ref: '#/components/schemas/VerifiableCredential'
            - type: array
              items:
                type: object
                $ref: '#/components/schemas/VerifiableCredential'
    VerifiablePresentation:
      description: Verifiable Presentation that has been signed
      type: object
      properties:
        '@context':
          $ref: '#/components/schemas/Context'
        id:
          type: string
          format: uri
        type:
          type: array
          items:
            type: string
        verifiableCredential:
          oneOf:
            - type: object
              $ref: '#/components/schemas/VerifiableCredential'
            - type: array
              items:
                type: object
                $ref: '#/components/schemas/VerifiableCredential'
        proof:
          oneOf:
            - type: object
              $ref: '#/components/schemas/VerifiableProof'
            - type: array
              items:
                type: object
                $ref: '#/components/schemas/VerifiableProof'
    VerifiableProof:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/SigType'
        proofPurpose:
          $ref: '#/components/schemas/ProofPurpose'
        verificationMethod:
          type: string
        created:
          type: string
          format: date-time
        proofValue:
          type: string
    CredentialMetadata:
      type: object
      description:
        Represents metadata related to a verifiable credential. This includes information about the
        credential's issuer, issuance and expiration dates, revocation status, and additional
        properties such as size and subject reference.
      properties:
        id:
          type: string
          format: uri
          description:
            The unique identifier for the credential, typically a URL pointing to its location or a
            hash value.
          example: 'https://creds.truvera.io/521bb7...'
        issuerKey:
          type: string
          nullable: true
          description:
            The DID and key identifier of the issuer that signed the credential. This key is used to
            verify the authenticity of the credential.
          example: 'did:key:z6Mk...dsmK'
        issuerName:
          type: string
          nullable: true
          description: The profile name of the issuer that signed the credential.
          example: 'Truvera Issuer'
        type:
          type: string
          description: The type of credential.
          example: 'VerifiableCredential'
        revocationRegistry:
          type: string
          description:
            The registry identifier for revocation information associated with the credential.
          example: 'e6d3...59d1'
        revoked:
          type: boolean
          description:
            Indicates whether the credential has been revoked. If true, the credential is no longer
            valid
          example: false
        createdAt:
          type: string
          format: date-time
          description: The date and time when the credential metadata was created.
          example: '2024-09-20T11:13:03.445Z'
        expiryDate:
          type: string
          format: date-time
          nullable: true
          description: The expiration date of the credential.
          example: '2024-09-20T11:13:03.445Z'
        expirationDate:
          type: string
          format: date-time
          nullable: true
          description: Alternative field for the expiration date of the credential.
          example: '2024-09-20T11:13:03.445Z'
        issuanceDate:
          type: string
          format: date-time
          description: The date and time when the credential was issued.
          example: '2024-09-20T11:13:02.648Z'
        byteSize:
          type: integer
          description: The size of the credential in bytes.
          example: 1003
        persist:
          type: boolean
          description: Indicates whether the credential is persisted in storage.
          example: false
        index:
          type: string
          description: A unique index or identifier within a collection of credentials.
          example: '1004'
        subjectRef:
          type: string
          description:
            A reference to the subject of the credential, typically used to identify the entity to
            which the credential pertains.
          example: 'Truvera Ref'
        subjectId:
          type: string
          description:
            The credential subject ID (e.g. holder DID), stored when the team setting is enabled.
            Useful for filtering credentials by holder.
          example: 'did:dock:5DDtWbr9C5HmK3mcz5HRXKbmf5sSCvAycqzWffVbvg9nq9fk'
        whitelabel:
          type: number
          nullable: true
          description:
            Indicates if the credential is associated with a specific whitelabel or brand.
          example: null
        algorithm:
          type: string
          description: The algorithm used for creating or signing the credential.
          maxLength: 32
          minLength: 4
          example: 'dockbbs'
        credential:
          anyOf:
            - $ref: '#/components/schemas/null_type'
            - $ref: '#/components/schemas/VerifiableCredential'
        warning:
          type: string
          description: >-
            Present only when the deprecated `password` query parameter is used to retrieve
            decrypted credential contents.
          example:
            'This endpoint is deprecated and should not be used. Refer to the cloud wallet
            documentation for the recommended approach.'
    VerifiableCredential:
      description:
        Verifiable (signed) Credential returned by API. The current set of properties is almost
        complete
      type: object
      properties:
        '@context':
          $ref: '#/components/schemas/Context'
        id:
          type: string
        type:
          type: array
          items:
            type: string
        credentialSubject:
          oneOf:
            - type: object
            - type: array
              items:
                type: object
        issuer:
          oneOf:
            - type: string
              $ref: '#/components/schemas/DID'
            - type: object
        issuanceDate:
          type: string
          format: date-time
        expirationDate:
          type: string
          format: date-time
        credentialStatus:
          description: Revocation registry id or user supplied status object
          oneOf:
            - type: object
            - type: string
        proof:
          oneOf:
            - type: object
              $ref: '#/components/schemas/VerifiableProof'
            - type: array
              items:
                type: object
                $ref: '#/components/schemas/VerifiableProof'
    VerifiableCredentialSchema:
      description: Verifiable Credential Schema
      type: object
      properties:
        '$schema':
          type: string
          maxLength: 2048
          description: The schema version, generally following the JSON-schema specification.
          example: 'http://json-schema.org/draft-07/schema#'
        name:
          type: string
          maxLength: 256
          description: Name of the schema.
          example: 'My Schema'
        description:
          type: string
          maxLength: 2000
          description: A brief description of the schema.
          example: 'Truvera Schema Example'
        type:
          type: string
          maxLength: 64
          description: Defines the type of schema. Usually 'object'.
          example: 'object'
        properties:
          type: object
          description: The properties that define the schema.
          example:
            id:
              type: 'string'
            emailAddress:
              type: 'string'
              format: 'email'
            alumniOf:
              type: 'string'
        required:
          type: array
          items:
            type: string
          description: Required fields within the schema.
          example:
            - emailAddress
            - alumniOf
        additionalProperties:
          type: boolean
          description:
            Specifies whether additional properties outside the defined schema are allowed.
          example: true
        '$metadata':
          description: Truvera metadata stored with the schema.
          properties:
            variant:
              $ref: '#/components/schemas/SchemaVariant'
    SchemaVariant:
      description:
        Optional issuance defaults stored with a schema. Applied when an issue request references
        the schema and omits the corresponding field.
      type: object
      properties:
        format:
          type: string
          enum: [jsonld, jwt, sdjwt]
          description: Default output format of credentials issued with this schema.
          example: 'jsonld'
        algorithm:
          type: string
          maxLength: 32
          minLength: 4
          description:
            Specifies which signing algorithm to use to sign the issued credential. Defaults to
            ed25519 for jsonld/jwt and secp256r1 (ES256) for sdjwt. For ZKP credentials use dockbbs.
          example: 'dockbbs'
        revocable:
          type: boolean
          description: Whether credentials issued with this schema are revocable by default. Not supported with the sdjwt format.
          example: true
    VerifiableCredentialSchemaResponse:
      type: object
      properties:
        id:
          type: string
          description: The schema ID
          example: 'https://schema.truvera.io/ExampleSchema-V5-1722512884923.json'
        schema:
          anyOf:
            - $ref: '#/components/schemas/null_type'
            - $ref: '#/components/schemas/VerifiableCredentialSchema'
        uri:
          type: string
          description: The schema URI
          example: 'https://schema.truvera.io/ExampleSchema-V5-1722512884923.json'
        created:
          type: string
          format: date-time
        isOwner:
          type: boolean
          description: Whether the current user is the owner of the schema
          example: true
        ownerName:
          type: string
          description: The owner name
          example: 'Truvera'
        ownerLogo:
          type: string
          description: The owner logo
          example: 'https://logo.truvera.io/owner'
        hasDelegationRuleset:
          type: boolean
          description: Whether the schema has at least one delegation ruleset linked to it
          example: false
    VerifiableCredentialSchemasResponse:
      type: array
      items:
        $ref: '#/components/schemas/VerifiableCredentialSchemaResponse'
    Registry:
