      description:
        Credential revocation is managed with on-chain revocation registries. To revoke a
        credential, its id (or hash of its id) must be added to the credential. More info about
        [Revoke/Unrevoke
        Credentials](https://docs.truvera.io/developer-documentation/truvera-api/registries#revoke-unrevoke-credential)
      requestBody:
        description: Specify action and credential ids
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  default: revoke
                  type: string
                  enum:
                    - revoke
                    - unrevoke
                credentialIds:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items:
                    type: string
                    format: uri
            example:
              action: revoke
              credentialIds:
                - https://credentials.truvera.io/3e343b80ebaefb40d8f9d99ec27a885e

      responses:
        '200':
          description: Will try to revoke/unrevoke the credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStartedResult'
              example:
                id: '2541'
                data:
                  revokeIds:
                    - '0xaff1aa6770d43d684690c0ad679a8608d5b7576feb3fdc1d6712decf73ca44e'
