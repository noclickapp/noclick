    OID4VPJWK:
      type: object
      description:
        Represents a JSON Web Key (JWK) used in OID4VP, detailing the key type, curve, public key
        material, and associated algorithms.
      properties:
        kty:
          type: string
          description: The key type (e.g., "OKP", "EC").
          example: 'OKP'
        crv:
          type: string
          description: The curve used with the key (e.g., "Ed25519", "P-256").
          example: 'Ed25519'
        x:
          type: string
          description: The public key material (base64url encoded).
          example: 'Q49t...IT0E'
        y:
          type: string
          description: The y-coordinate for the public key (only for EC keys).
          example: 'afTq...pD3w'
        kid:
          type: string
          description: The key identifier, typically including the DID and key fragment.
          example: 'did:key:z6Mk...MMw48G#z6Mk...MMw48G'
        alg:
          type: string
          description: The algorithm used with the key.
          example: 'EdDSA'
    OID4VPJWKsResponse:
      type: object
      properties:
        keys:
          type: array
          description: A list of cryptographic keys.
          items:
            $ref: '#/components/schemas/OID4VPJWK'
    OpenIDIssuersTokenResponse:
      type: object
      description:
        The response from an OpenID token endpoint, containing an access token, ID token, and any
        related credential information.
      properties:
        access_token:
          type: string
          description: The access token issued by the authorization server.
          example: 'df0c70ac-70c3...Qs0IVH4'
        token_type:
          type: string
          description: The type of the token issued, typically "bearer".
          example: 'bearer'
        expires_in:
          type: integer
          description: The lifetime in seconds of the access token.
          example: 86400
        id_token:
          type: string
          description: The ID token representing the identity of the user.
          example: 'eyJhbG...d9ttgM'
        credential:
          type: object
          description: The credential information issued alongside the access token.
          properties:
            data:
              oneOf:
                - type: string
                - type: object
                  $ref: '#/components/schemas/VerifiableCredential'
security:
  - bearerAuth: []
  - accessToken: []
  - nextAuth: []

paths:
  /teams/accept-member-invite:
    post:
      summary: Accept invitation to be a team member
      tags:
        - teams
      requestBody:
        description: Accept invitation token
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - accept_invitation_token
              properties:
                accept_invitation_token:
                  description: The token received in the mail
                  type: string
                  maxLength: 4096
      responses:
        '200':
          description: Invitation has been accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '400':
          description: Error accepting the invitation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '402':
          description: Transaction limit reached or upgrade required to proceed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /teams/{id}/invite:
    post:
      summary: Send email invitations to a list of emails
      tags:
        - teams
      parameters:
        - name: id
          in: path
          required: true
          description: An ID
          schema:
            type: integer
      requestBody:
        description: Emails array
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - emails
              properties:
                emails:
                  description: The emails list
                  type: array
      responses:
        '200':
          description: Invitations have been sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        '400':
          description: Error sending the invitations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: You are not the owner or the administrator of this team
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '402':
          description: Transaction limit reached or upgrade required to proceed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /teams/{id}:
    get:
      summary: Get team data
      tags:
        - teams
      parameters:
        - name: id
          in: path
          required: true
          description: An ID
          schema:
            type: integer
      responses:
        '200':
          description: Team has been updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '401':
          description: You are not a part of this team
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      summary: Update a Team
      tags:
        - teams
      parameters:
        - name: id
          in: path
          required: true
          description: An ID
          schema:
            type: integer
      requestBody:
        description: Team JSON object that will be applied
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  description: The new team name
                  type: string
                  maxLength: 256
                retentionPolicy:
                  description: The team data retention policy
                  type: object
                storeSubjectRef:
                  description: Whether to store the subject reference in the team
                  type: boolean
      responses:
        '200':
          description: Team has been updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '400':
          description: Error updating team
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: You are not the owner or the administrator of this team
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
