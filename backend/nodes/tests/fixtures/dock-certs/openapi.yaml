  /openid/vp/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Proof request UUID
        schema:
          type: string
          format: uuid
    post:
      security: []
      tags:
        - openid-holder
      summary: OID4VP callback submit
      description:
        Handles the submission of a callback for an OID4VP proof request. This endpoint processes
        the proof and returns the result to the client.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
          text/plain:
            schema:
              type: string
          application/json:
            schema:
              type: object
      responses:
        '302':
          description: Redirect to the authorization URL.
          headers:
            Location:
              description: The URL to which the client is being redirected.
              schema:
                type: string
                format: uri
                example: 'openid://?state=RrD3...hapo&nonce=1234567890&code=jB9b...o030'
        '200':
          description: Callback successful (SIOPV2)
          content:
            application/json:
              schema:
                type: object
                properties:
                  state:
                    type: string
                    description: The state parameter from the request
                    example: 'RrD3...hapo'
                  code:
                    type: string
                    description: The code parameter from the request
                    example: 'jB9b...o030'
                  verified:
                    type: boolean
                    description: Whether the request was verified
                    example: true
                  nonce:
                    type: string
                    description: The nonce parameter from the request
                    example: '1234567890'
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Proof request was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '402':
          description: Transaction limit reached or upgrade required to proceed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

