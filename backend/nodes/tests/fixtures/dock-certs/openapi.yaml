    OpenIDAuthProviderOptions:
      type: object
      description: OpenID provider configuration
      properties:
        url:
          type: string
          format: uri
          minLength: 8
          maxLength: 2048
          example: 'https://creds.truvera.io/claims'
        scope:
          type: array
          items:
            type: string
          example:
            - 'openid'
        clientId:
          type: string
          maxLength: 1024
          example: 'eyAic2NoZW1hIjogImh0dHBzOi8vZG9ja25ldHdvcmsuZ2l0aHViLmlvL3ZjLXNjaGVtYXMvYmFzaWMtY3JlZGVudGlhbC5qc29uIiwgImNsYWltcyI6IFsibmFtZSJdIH0='
        clientSecret:
          type: string
          maxLength: 1024
          example: 'gpO2IVK+OALL8W+DcFlIfFhJtNA='
        claimsSource:
          type: string
          enum:
            - idToken
            - userInfo
          default: 'idToken'
          example: 'idToken'
        requestParameters:
          type: object
          description:
            Optional extra request parameters passed to the federated OpenID provider, such as login
            hint
          example:
            login_hint: 'user@example.com'
            prompt: 'login'
    OpenIDIssuerCreateRequest:
      type: object
      description:
        Represents the configuration and options to create an OpenID issuer, including credential
        options, authentication provider details, and claim mappings.
      properties:
        credentialOptions:
          $ref: '#/components/schemas/CredentialIssueRequest'
        authProvider:
          $ref: '#/components/schemas/OpenIDAuthProviderOptions'
        claimMap:
          type: object
          description:
            Key/value pair mapping for OpenID claims to JSON-LD terms. Can be null/undefined if no
            3rd party claims to pull.
          example:
            name: 'name'
        singleUse:
          type: boolean
          default: false
          description:
            Whether or not to expire this issuer (and all URLs related to it) after one credential
            is issued
          example: false
      required:
        - credentialOptions
    OpenIDIssuer:
      type: object
      description:
        Represents the configuration and options for an OpenID issuer, including credential options,
        authentication provider details, and claim mappings.
      properties:
        credentialOptions:
          $ref: '#/components/schemas/CredentialIssueRequest'
        authProvider:
          $ref: '#/components/schemas/OpenIDAuthProviderOptions'
        claimMap:
          type: object
          description: Key/value pair mapping for OpenID claims to JSON-LD terms
          example:
            name: 'name'
        singleUse:
          type: boolean
          default: false
        issuer:
          type: string
        protocol:
          type: string
          default: 'default'
      required:
        - credentialOptions
    OpenIDIssuers:
      type: array
      items:
        $ref: '#/components/schemas/OpenIDIssuer'
    OpenIDCredentialIssuerConfig:
      type: object
      description:
        Defines the configuration details for an OpenID credential issuer, including endpoints for
        authorization, token exchange, and key sets.
      properties:
        authorization_endpoint:
          type: string
          format: uri
          description:
            The endpoint used by the client to obtain authorization from the resource owner.
          example: 'https://example.com/openid/issuers/b582...173c/authorize'
        token_endpoint:
          type: string
          format: uri
          description:
            The endpoint used by the client to exchange an authorization grant for an access token.
          example: 'https://example.com/openid/issuers/b582...173c/token'
        jwks_uri:
          type: string
          format: uri
          description:
            The URI for the JSON Web Key Set, which contains the public keys used to verify tokens.
          example: 'https://example.com/openid/issuers/b582...173c/jwks'
        issuer:
          type: string
          format: uri
          description: The issuer identifier for the authorization server.
          example: 'https://example.com/openid/issuers/b582...173c'
        code_challenge_methods_supported:
          type: array
          description: List of supported code challenge methods for PKCE.
          items:
            type: string
          example:
            - 'S256'
        token_endpoint_auth_signing_alg:
          type: string
          description: The algorithm used for signing at the token endpoint.
          example: 'HS256'
        token_endpoint_auth_signing_alg_values_supported:
          type: array
          description: The list of signing algorithms supported by the token endpoint.
          items:
            type: string
          example:
            - 'HS256'
        request_object_signing_alg_values_supported:
          type: array
          description: Supported signing algorithms for request objects.
          items:
            type: string
          example:
            - 'EdDSA'
            - 'ES256'
        claims_parameter_supported:
          type: boolean
          description: Indicates whether the claims parameter is supported.
          example: true
        claims_supported:
          type: array
          description: List of claims supported by the issuer.
          items:
            type: string
          example:
            - 'sub'
            - 'sid'
            - 'auth_time'
            - 'iss'
        grant_types_supported:
          type: array
          description: List of grant types supported by the authorization server.
          items:
            type: string
          example:
            - 'authorization_code'
        id_token_signing_alg_values_supported:
          type: array
          description: List of signing algorithms supported for ID tokens.
          items:
            type: string
          example:
            - 'HS256'
