  /delegatable-revocations/{registryId}:
    parameters:
      - name: registryId
        in: path
        required: true
        description: Delegatable revocation registry id
        schema:
          $ref: '#/components/schemas/Hex32'
    post:
      tags:
        - delegatableRevocation
      summary: Create or update delegatable revocation status
      description:
        Claims a registry (create) or marks the delegated credential id as revoked or unrevoked.
        Requires a DID-signed EdDSA bearer JWT whose iss is the controller did:key and whose
        registryId, action, credentialId and statusListIndex claims match the request. The first
        authenticated call binds the registry to the caller DID; subsequent calls must be signed by
        that same DID.
      security:
        - sponsorKey: []
          didKeyAuth: []
      requestBody:
        description: Delegatable revocation action payload
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DelegatableRevocationControlRequest'
            example:
              action: revoke
              credentialId: https://example.com/delegated/credential/1
              statusListIndex: 0
      responses:
        '200':
          description: Delegatable revocation action applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DelegatableRevocationControlResponse'
        '400':
          description: Invalid params
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Registry is controlled by a different DID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: statusListIndex or credentialId conflict
          content:
            application/json:
