      responses:
        '200':
          description: OpenID issuer will be deleted
        '400':
          description: Something went wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: OpenID issuer was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /openid/issuers/{id}/authorize:
    parameters:
      - name: id
        in: path
        required: true
        description: OpenID issuer UUID
        schema:
          type: string
          format: uuid
    get:
      security: []
      tags:
        - openid-holder
      summary: OpenID authorize endpoint
      description:
        Redirects the client to the authorization URL for a specific OpenID issuer. This endpoint
        begins the authorization flow, allowing users to authenticate with the issuer.
      responses:
        '302':
          description: Redirect to the authorization URL.
          headers:
            Location:
              description: The URL to which the client is being redirected.
              schema:
                type: string
                format: uri
                example: 'https://example.com/authorize?client_id=xyz&response_type=code&nonce=randomNonce&state=randomState&scope=openid&redirect_uri=https://client.example.com/callback'
        '400':
          description: Something went wrong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: OpenID issuer was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /openid/issuers/{id}/callback:
    parameters:
      - name: id
        in: path
        required: true
        description: OpenID issuer UUID
        schema:
          type: string
          format: uuid
    get:
      security: []
      tags:
        - openid-holder
      summary: OpenID callback endpoint
      description:
        Processes the callback from the OpenID issuer after user authentication. This endpoint
        finalizes the authorization flow and returns control to the client application.
      responses:
        '302':
          description: Redirect to the authorization URL.
          headers:
            Location:
              description: The URL to which the client is being redirected.
              schema:
                type: string
                format: uri
                example: 'https://example.com/redirect?url=truvera.wallet%3A%2F%2Fcredentials%2Fcallback&code=nWPj...5MTc&state=SLSx...KveQ'
        '400':
          description: Something went wrong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: OpenID issuer was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /openid/issuers/{id}/token:
    parameters:
      - name: id
        in: path
        required: true
        description: OpenID issuer UUID
        schema:
          type: string
          format: uuid
    post:
      security: []
      tags:
        - openid-holder
      summary: OpenID token endpoint
      description:
        Handles the exchange of an authorization code for an access token, ID token, and optionally
        a refresh token. This endpoint is a key part of the OpenID Connect flow.
      responses:
        '200':
          description: OpenID token endpoint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenIDIssuersTokenResponse'
        '400':
          description: Something went wrong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: OpenID issuer was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /openid/credential:
    post:
      security: []
      tags:
        - openid-holder
      summary: OpenID credential retrieve endpoint
      description:
        Retrieves a verifiable credential issued by an OpenID issuer. This endpoint is used to
        obtain the credential in a specified format after the issuance process.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                types:
                  type: array
                  description: The types of the Verifiable Credential.
                  items:
                    type: string
                  example:
                    - 'ldp_vc:MyCredential'
                format:
                  type: string
                  maxLength: 64
                  description: The format of the Verifiable Credential.
                  example: 'jwt_vc_json'
                proof:
                  type: object
                  description: The proof object containing cryptographic proof information.
                  properties:
                    proof_type:
                      type: string
                      maxLength: 64
                      description: The type of proof used.
                      example: 'jwt'
                    jwt:
                      type: string
                      maxLength: 8192
                      description: The JWT containing the proof.
                      example: 'eyJhbG...-xzuDg'
      responses:
        '200':
          description: OpenID credential retrieve endpoint
          content:
            application/json:
              schema:
                type: object
                properties:
                  credential:
                    oneOf:
                      - type: string
                      - type: object
                        $ref: '#/components/schemas/VerifiableCredential'
                  format:
                    type: string
                    description: The format of the credential
                    example: 'ldp_vc'
        '400':
          description: Something went wrong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: OpenID issuer was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /openid/issuers/{id}/.well-known/openid-credential-issuer:
    get:
      security: []
      tags:
        - openid-holder
      summary: Public OpenID issuer configuration route
      description:
        Retrieves the OpenID configuration document for a specified issuer UUID. This document
        contains the public configuration details necessary for client applications to interact with
        the issuer.
      parameters:
        - name: id
          in: path
          required: true
          description: OpenID issuer UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The well known config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenIDCredentialIssuerConfig'
        '400':
