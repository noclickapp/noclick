          $ref: '#/components/schemas/URI'
      - name: password
        in: query
        required: false
        deprecated: true
        description: >-
          **Deprecated.** Supplying this parameter to retrieve decrypted persisted credential
          contents is deprecated and should not be used. Refer to the cloud wallet documentation for
          the recommended approach.
        schema:
          type: string
          maxLength: 64
          minLength: 4
    get:
      tags:
        - credentials
      summary: Get credential metadata and contents if persistent
      description: >-
        Get credential metadata and, if persistent, its contents.


        **Deprecation notice:** retrieving decrypted persisted credential contents by supplying the
        `password` query parameter is deprecated and should not be used. Refer to the cloud wallet
        documentation for the recommended approach. When the `password` parameter is used, the
        response includes a `warning` field and `Deprecation`/`Warning` response headers. Retrieving
        credential metadata without a password is not deprecated.
      responses:
        '200':
          description: >-
            The request was successful and will return the credential metadata and its JSON contents
            (if password was supplied). When the deprecated `password` query parameter is used, the
            response also contains a `warning` field describing the deprecation, and `Deprecation:
            true` and `Warning: 299` response headers are set.
          headers:
            Deprecation:
              description:
                Set to `true` when a deprecated feature (password-based decryption) was used.
              schema:
                type: string
            Warning:
              description:
                A `299` warning describing the deprecation, set when password-based decryption was
                used.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialMetadata'
        '404':
          description: Credential was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Error retrieving the credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
