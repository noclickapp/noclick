  /schemas:
    post:
      tags:
        - schemas
      summary: Create Credential Schema
      description:
        Creates a JSON schema on the blockchain. More info about [Schema
        Creation](https://docs.truvera.io/developer-documentation/truvera-api/credential-schemas#create-schema)
      requestBody:
        description: JSON-schema
