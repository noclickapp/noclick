openapi: 3.0.0
info:
  title: Zoho Writer Template API
  version: "1.0.0"
  description: >-
    The Zoho Writer Template API lets you create, list, retrieve, copy, and delete
    Writer templates. Organization template operations require a template admin role
    in Zoho WorkDrive and a non-Personal Edition plan.

servers:
  - url: "www.zohoapis.com"
    description: US data center

security:
  - oAuth2:
      - ZohoWriter.documentEditor.ALL

tags:
  - name: Templates
    description: >-
      Manages the Zoho Writer template catalogue, personal or
      organization-scoped, covering creation from scratch, an uploaded file, a
      URL, or an existing document; browsing; copying as a new template or a
      standalone document; and deletion. Organization-scoped operations require a
      template admin role and a non-Personal Edition WorkDrive plan.

paths:

  /writer/api/v1/templates:
    get:
      tags:
        - Templates
      summary: List Templates
      description: >-
        Retrieves a paginated list of templates, optionally filtered by category
        (personal or organization) or team, and sorted by a chosen field.
      operationId: listTemplates
      parameters:
        - name: type
          in: query
          required: false
          description: The category of templates to list.
          schema:
            type: string
            enum:
              - personal
              - organization
            default: personal
        - name: offset
          in: query
          required: false
          description: The starting index for pagination.
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          required: false
          description: >-
            The maximum number of templates to return in a single response. Maximum allowed
            value is 100.
          schema:
            type: integer
            default: 50
            maximum: 100
        - name: sortby
          in: query
          required: false
          description: >
            The field by which to sort the template list.
            `name` sorts alphabetically, `created_time` sorts by creation date,
            and `modified_time` sorts by the date the template was last modified.
            If omitted, the default order for the account type is used.
          schema:
            type: string
            enum:
              - name
              - created_time
              - modified_time
        - name: team_id
          in: query
          required: false
          description: The ID of the team/organization whose templates to retrieve.
          schema:
            type: string
      responses:
        "200":
          description: List of templates retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                example:
                  total_count: 5
                  templates:
                    - created_time: "2019-08-28T16:30:33Z"
                      modified_time_ms: 1567009834477
                      owner_id: "14335411"
                      last_opened_time: "2019-08-28T16:30:33Z"
                      open_url: "https://writer.zoho.com/writer/template/a7iyybadb"
                      last_opened_time_ms: 1567009833936
                      type: "template"
                      thumbnail_url: "https://writer.zoho.com/writer/thumbnail/a7iyybadb"
                      created_by: "amelia"
                      created_time_ms: 1567009833936
                      modified_time: "2019-08-28T16:30:34Z"
                      preview_url: "https://writer.zoho.com/writer/zwpreview/a7iyybadbb8"
                      creator_id: "11122329"
                      name: " New Template"
                      id: "a7iyybadbb8b74e1147638bad04abc161e79e"
                      permalink: "https://writer.zoho.com/file/a7iyybadb"
                      status: "active"
      security:
        - oAuth2:
            - ZohoWriter.documentEditor.ALL
            - WorkDrive.files.ALL
            - WorkDrive.organization.ALL
            - WorkDrive.workspace.ALL

    post:
      tags:
        - Templates
      summary: Create Template
      description: >
        <p>Creates a Zoho Writer template, optionally populated from an uploaded file, a
        web URL, plain text, or an existing document or template to duplicate. If none of
        those is provided, a blank template is created.</p><br>
        <p>Provide at most one of <code>content</code>, <code>url</code>, <code>text</code>,
        or <code>document_id</code>.</p>
      operationId: createTemplate
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                content:
                  type: string
                  format: binary
                  description: >
                    The file to upload as the new template's content, up to 13 MB.
                    Supported formats: `docx`, `rtf`, `html`, `txt`, `odt`.
                url:
                  type: string
                  format: uri
                  maxLength: 5000
                  description: >
                    A publicly accessible URL from which to import the template content, up
                    to 13 MB. Supported formats: `docx`, `rtf`, `html`, `txt`, `odt`.
                  example: "https://zylker.com/invoice-template.docx"
                text:
                  type: string
                  maxLength: 100000
                  description: The plain text content to populate the new template with.
                  example: "Invoice details for Q1 2026"
                document_id:
                  type: string
                  description: >
                    The unique ID of an existing document or template to duplicate as the
                    new template's content. The authenticated user must have copy access to
                    this resource.
                  example: "t04apjk9p7d6ba94f4cbf9c56e1b1ed9bac89"
                name:
                  type: string
                  maxLength: 255
                  description: >
                    A unique name for the new template. If omitted, a default untitled name
                    is used.
                  example: "Invoice Template 2026"
                type:
                  type: string
                  enum:
                    - personal
                    - organization
                  description: >-
                    The category under which the template is created. Creating an `organization`
                    template requires the template admin role in Zoho WorkDrive and a
                    non-Personal Edition WorkDrive plan.
                  default: personal
                team_id:
                  type: string
                  description: >
                    The unique ID of the team/organization in which to create the template.
                    Applicable only when `type` is `organization`.
                password:
                  type: string
                  maxLength: 255
                  description: >
                    The password to unlock the uploaded `content` file or the document
                    imported from `url`, if it is password-protected.
      responses:
        "200":
          description: Template created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateObject'
      security:
        - oAuth2:
            - ZohoWriter.documentEditor.ALL
            - WorkDrive.files.ALL
            - WorkDrive.organization.ALL
            - WorkDrive.workspace.ALL

  /writer/api/v1/templates/{template_id}:
    get:
      tags:
        - Templates
      summary: Get Template Details
      description: >-
        Retrieves detailed metadata for a specific Zoho Writer template, including
        its ID, name, owner, creation and modification timestamps, access URLs, and
        the caller's permissions on it.
      operationId: getTemplateDetails
      parameters:
        - name: template_id
          in: path
          required: true
          description: The unique identifier of the template.
          schema:
            type: string
          example: a1b2c3d4e5f6g7h8i9
      responses:
        "200":
          description: Template details retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                example:
                  created_time: "2019-08-28T16:30:33Z"
                  modified_time_ms: 1567009834477
                  owner_id: "14335411"
                  last_opened_time: "2019-08-28T16:30:33Z"
                  open_url: "https://writer.zoho.com/writer/template/a7iyybadb"
                  last_opened_time_ms: 1567009833936
                  type: "template"
                  thumbnail_url: "https://writer.zoho.com/writer/thumbnail/a7iyybadb"
                  created_by: "amelia"
                  created_time_ms: 1567009833936
                  modified_time: "2019-08-28T16:30:34Z"
                  preview_url: "https://writer.zoho.com/writer/zwpreview/a7iyybadbb8"
                  creator_id: "11122329"
                  name: "Sample Name"
