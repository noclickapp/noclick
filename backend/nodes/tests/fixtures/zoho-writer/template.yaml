                  permalink: "https://writer.zoho.com/file/a7iyybadb"
                  status: "active"
                  permissions:
                    can_delete: true
                    can_trash: true
                    can_share: true
                    can_download: true
                    can_publish: true
                    can_org_publish: false
                    can_edit: true
                    can_rename: true
                    can_favourite: true
                    can_read: true
                    can_restore: true
                    can_lock: true
                    can_unlock: true
                    can_discard_lock: true
                    is_admin: false
                    can_read_fill: true
                    can_copy: true
                    can_leave: false
                    can_remove_share: true
      security:
        - oAuth2:
            - ZohoWriter.documentEditor.ALL
            - WorkDrive.files.ALL
            - WorkDrive.organization.ALL
            - WorkDrive.workspace.ALL

  /writer/api/v1/templates/{template_id}/copy:
    post:
      tags:
        - Templates
      summary: Copy Template
      description: >
        <p>Creates a copy of a specific Zoho Writer template, either as a new template or
        as a standalone document.</p>
      operationId: copyTemplate
      parameters:
        - name: template_id
          in: path
          required: true
          description: The unique identifier of the template to copy.
          schema:
            type: string
          example: a1b2c3d4e5f6g7h8i9
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum:
                    - personal
                    - organization
                  description: >-
                    The category under which the copied template is created. Copying to
                    `organization` requires the template admin role in Zoho WorkDrive and a
                    non-Personal Edition WorkDrive plan.
                  default: personal
                name:
                  type: string
                  maxLength: 255
                  description: >
                    A unique name for the copied template. If omitted, defaults to "Copy of"
                    followed by the source template's name.
                  example: "Copy of Invoice Template 2026"
                save_as:
                  type: string
                  enum:
                    - document
                    - template
                  default: template
                  description: >
                    Whether the copy is saved as a template or converted into a standalone
                    document.
                team_id:
                  type: string
                  description: >
                    The unique ID of the team/organization library to copy the template into.
                    Applicable only when copying a public template.
      responses:
        "200":
          description: >-
            Success response. The fields returned depend on whether the copy was saved as
            a template or as a document.
          content:
            application/json:
              schema:
                type: object
              examples:
