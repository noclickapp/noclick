        last_opened_time: "2019-08-28T16:30:33Z"
        open_url: "https://writer.zoho.com/writer/template/a7iyybadb"
        last_opened_time_ms: 1567009833936
        type: "template"
        thumbnail_url: "https://writer.zoho.com/writer/thumbnail/a7iyybadb"
        created_by: "amelia"
        created_time_ms: 1567009833936
        modified_time: "2019-08-28T16:30:34Z"
        preview_url: "https://writer.zoho.com/writer/zwpreview/a7iyybadbb8"
        creator_id: "11122329"
        name: " Sample Name"
        id: "a7iyybadbb8b74e1147638bad04abc161e79e"
        permalink: "https://writer.zoho.com/file/a7iyybadb"
        status: "active"
  securitySchemes:
    oAuth2:
      type: oauth2
      description: Zoho OAuth 2.0 authentication.
      flows:
        authorizationCode:
          authorizationUrl: "https://accounts.zoho.com/oauth/v2/auth"
          tokenUrl: "https://accounts.zoho.com/oauth/v2/token"
          scopes:
            ZohoWriter.documentEditor.ALL: Full access to the Zoho Writer document editor.
            WorkDrive.files.ALL: Full access to Zoho WorkDrive files.
            WorkDrive.organization.ALL: Full access to Zoho WorkDrive organization resources.
            WorkDrive.workspace.ALL: Full access to Zoho WorkDrive workspaces.
