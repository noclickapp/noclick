  /writer/api/v1/templates/{template_id}/delete:
    delete:
      tags:
        - Templates
      summary: Delete Template
      description: >-
        Permanently deletes a specific Zoho Writer template from the template list.
        Deleting an organization template requires the template admin role in Zoho
        WorkDrive and a non-Personal Edition WorkDrive plan.
      operationId: deleteTemplate
      parameters:
        - name: template_id
          in: path
          required: true
          description: The unique identifier of the template to delete.
          schema:
            type: string
          example: a1b2c3d4e5f6g7h8i9
      responses:
        "200":
          description: Template deleted successfully.
          content:
            application/json:
              schema:
                type: object
                example:
                  deleted_by:
                    email_id: "amelia@zylker.com"
                    profile_photo: "https://contacts.zoho.com/file?t=user&ID=1247393&fs=thumb"
                    user_id: "1247393"
                    timezone: "Asia/Kolkata"
                    language: "en"
                    display_name: "Amelia"
                  message: "Template has been deleted successfully."
      security:
