---
openapi: 3.1.0
components:
  schemas:
    ApiConversationMainContact:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        mobilePhone:
          type: string
        primaryEmail:
          type: string
        externalId:
          type: string
        source:
          type: string
        updatedDate:
          type: string
          format: date-time
          examples:
          - 2022-03-10T16:15:50Z
        createdDate:
          type: string
          format: date-time
          examples:
          - 2022-03-10T16:15:50Z
    ApiConversationMessage:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Message id in Kenect's system
        conversationId:
          type: integer
          format: int64
          description: Conversation id in Kenect's system this message belongs to
        messageBody:
          type: string
          description: Body/content of the message
        senderUserId:
          type: integer
          format: int64
          description: "Identifier of the user who sent the message, if available"
        reviewRequest:
          type: boolean
          description: Whether this message was sent as part of a review request
        outgoing:
          type: boolean
          description: "True if the message was sent from Kenect (outgoing), false\
            \ if received (incoming)"
        sentAt:
          type: string
          format: date-time
          examples:
          - 2025-09-10T14:30:00Z
          description: "Timestamp when the message was sent, in UTC"
        createdAt:
          type: string
          format: date-time
          examples:
          - 2025-09-10T14:29:00Z
          description: "Timestamp when the message was created in the system, in UTC"
        updatedAt:
          type: string
          format: date-time
          examples:
          - 2025-09-10T14:35:00Z
          description: "Timestamp when the message was last updated in the system,\
            \ in UTC"
        deletedAt:
          type: string
          format: date-time
          examples:
          - 2025-09-11T10:15:00Z
          description: "Timestamp when the message was deleted, if applicable, in\
            \ UTC"
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/ApiRMessageAttachment"
          description: List of attachments associated with the message. Always a list
            on reads (empty when there are none).
        externalStatus:
          type: string
          enum:
          - DELIVERED
          - FACEBOOK_SYNC
          - FAILED
          - NO_STATUS_SET
          - RECEIVED
          - SENT
          - SENDING
          - UNDELIVERED
          - BLOCKED
          description: Delivery status of the message
    ApiRMessageAttachment:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        md5:
          type: string
        contentType:
          type: string
        size:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
          examples:
          - 2022-03-10T16:15:50Z
        updatedAt:
          type: string
          format: date-time
          examples:
          - 2022-03-10T16:15:50Z
    Attachment:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          examples:
          - 1-attachments/code/file-name.png
          pattern: \S
          description: The path field returned by the pre-sign URL API.
    AttachmentInfo:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        signedUrl:
          type: string
        contentType:
          type: string
        type:
          type: string
        size:
          type: integer
          format: int64
    BrandDealerInfo:
      type: object
      properties:
        brandName:
          type: string
        dealerIdentifier:
          type: string
    BusinessHours:
      type: object
      properties:
        dayOfWeek:
          type: string
          description: "Day of week in uppercase (MONDAY, TUESDAY, ..., SUNDAY)"
        startTime:
          type: string
          description: "Opening time in HH:mm or HH:mm:ss format, in the location's\
            \ local timezone"
        endTime:
          type: string
          description: "Closing time in HH:mm or HH:mm:ss format, in the location's\
            \ local timezone"
    ContactBatchData:
      type: object
      required:
      - contacts
      - totalCount
      properties:
        contacts:
          type: array
          maxItems: 500
          minItems: 1
          items:
            $ref: "#/components/schemas/ContactData"
          description: List of contacts to be synced
        totalCount:
          type: integer
          format: int32
          description: "The total amount of contacts to be synced, not necessarily\
            \ the size of the contacts list"
    ContactBatchResponseTemplateData:
      type: object
      properties:
        contacts:
          type: array
          items:
            $ref: "#/components/schemas/PartnerContactTemplateData"
        offset:
          type: integer
          format: int32
        limit:
          type: integer
          format: int32
        totalResultCount:
          type: integer
          format: int32
    ContactData:
      type: object
      required:
      - firstName
      - lastName
      - mobilePhone
      - externalId
      properties:
        firstName:
          type: string
          description: Contact's first name
        lastName:
          type: string
          description: Contact's last name
        mobilePhone:
          type: string
          examples:
          - "+15555555555"
          pattern: \S
          description: "Contact's mobile phone number<br>Must follow the 'North American\
            \ phone numbers' or 'International phone numbers' standards<br>IE. +15555555555,\
            \ (555)555-5555"
        primaryEmail:
          type: string
          description: Contact's email address
        externalId:
          type: string
          pattern: \S
          description: Contact's id in partner's system
        birthday:
          type: integer
          format: int64
          examples:
          - 1640995200000
          description: "Contact's birthday in unix timestamp milliseconds<br>IE. 1640995200000\
            \ for January 1, 2022 12:00:00 AM"
        contactPhones:
          type: array
          examples:
          - - "1640995200000"
            - "(202) 555-1200]"
          items:
            type: string
          description: A list of possible phone numbers. Useful in case phone number
            validation is not possible in the client.The first valid number will be
            used to create the contact record in Kenect
        addressLine1:
          type: string
          examples:
          - 123 Main St
          description: First line of contact's address.
        addressLine2:
          type: string
          examples:
          - Apt 4B
          description: Second line of contact's address
        city:
          type: string
          examples:
          - New York
          description: Name of the contact's city
        state:
          type: string
          examples:
          - NY
          description: Name of the contact's state
        zipCode:
          type: string
          examples:
          - "10001"
          description: Contact's ZIP code
    EventNotificationData:
      type: object
      required:
      - eventName
      - phone
      - recordId
      properties:
        eventName:
          type: string
          examples:
          - CLOSED_SALE_EVENT
          pattern: \S
          description: "An unique key, configured in Kenect, identifying the event.<br>(all\
            \ the event names must be previously configured in Kenect before using\
            \ it)"
        assignedUserEmail:
          type: string
          examples:
          - john.doe@company.com
          description: Kenect user's email address used to assign messages to the
            user
        externalContactId:
          type: string
          examples:
          - "123"
          description: "The customer id in partner's system. If not present, the phone\
            \ number must be included in the request"
        phone:
          type: string
          examples:
          - "+15555555555"
          pattern: \S
          description: "When the 'Partner customer id' is not present, the notification\
            \ will be sent to this phone number.<br>Must follow the 'North American\
            \ phone numbers' or 'International phone numbers' standards<br>IE. +15555555555,\
            \ (555)555-5555"
        recordId:
          type: string
          examples:
          - "123"
          pattern: \S
          description: "An unique key which identify a single event/record on partner's\
            \ system.<br>IE. Invoice #, Service #, etc.<br>123, 'INV-000','123-456'"
        eventData:
          type: object
          examples:
          - customerName: John
          additionalProperties:
            type: string
          description: "A map with custom pairs of keys and values which will be available\
            \ for interpolation on the event message.<br>eventData={\"customerName\"\
            :\"John\"}, event message configured = \"Hello, {{customerName}}\", result\
            \ after interpolation=\"Hello, John\""
    GroupMessage:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        message:
          type: string
        contactGroupId:
          type: integer
          format: int64
        locationId:
          type: integer
          format: int64
        organizationId:
          type: integer
          format: int64
        scheduledByUserId:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
          examples:
          - 2022-03-10T16:15:50Z
        updatedAt:
          type: string
          format: date-time
          examples:
          - 2022-03-10T16:15:50Z
        sentAt:
          type: string
          format: date-time
          examples:
          - 2022-03-10T16:15:50Z
        scheduledToSendAt:
          type: string
          format: date-time
          examples:
          - 2022-03-10T16:15:50Z
        sentMessages:
          type: integer
          format: int32
        deliveredMessages:
          type: integer
          format: int32
        failedMessages:
          type: integer
          format: int32
    InboundLeadResponse:
      type: object
      properties:
        leadId:
          type: integer
          format: int64
        leadType:
          type: string
        leadSource:
          type: string
        externalLeadId:
          type: string
        messageBody:
          type: string
        senderPhone:
          type: string
        senderFirstName:
          type: string
        senderLastName:
          type: string
        senderEmail:
          type: string
        locationId:
          type: integer
          format: int64
        organizationId:
          type: integer
          format: int64
        attachments:
          type: array
          items: {}
    InboxConversationData:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Conversation ID in Kenect system
        subject:
          type: string
          description: Conversation subject
        snippet:
          type: string
        contactId:
          type: integer
          format: int64
          description: Main contact's Kenect contact ID associated with the conversation
        contact:
          $ref: "#/components/schemas/ApiConversationMainContact"
        assignedUserId:
          type: integer
          format: int64
          description: User ID of the Kenect user assigned to the conversation
        assignedTeamId:
          type: integer
          format: int64
        updatedDate:
          type: integer
          deprecated: true
          format: int64
          description: Epoch milliseconds. Use 'InboxConversationData.updatedAt' instead
        createdDate:
          type: integer
          deprecated: true
          format: int64
          description: Epoch milliseconds. Use 'InboxConversationData.createdAt' instead
        archiveDate:
          type: integer
          deprecated: true
          format: int64
          description: Epoch milliseconds. Use 'InboxConversationData.archivedAt'
            instead
        updatedAt:
          type: string
          format: date-time
          examples:
          - 2022-03-10T16:15:50Z
          description: ISO-8601 UTC timestamp
        createdAt:
          type: string
          format: date-time
          examples:
          - 2022-03-10T16:15:50Z
          description: ISO-8601 UTC timestamp
        archivedAt:
          type: string
          format: date-time
          examples:
          - 2022-03-10T16:15:50Z
          description: ISO-8601 UTC timestamp
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ApiConversationMessage"
    IntegrationLocationData:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Location id in Kenect's system
        organizationId:
          type: integer
          format: int64
          description: Organization id in Kenect's system
        locationName:
          type: string
          description: Location name
        address:
          type: string
          description: Location address line 1
        address2:
          type: string
          description: Location address line 2
        city:
          type: string
          description: Location city
        state:
          type: string
          description: Location state
        zip:
          type: string
          description: Location zipcode
        phone:
          type: string
          description: Location phone number
        timezone:
          type: string
          description: IANA timezone of the location (e.g. America/Chicago). May be
            null when not configured upstream.
        businessHours:
          type: array
          items:
            $ref: "#/components/schemas/BusinessHours"
          description: Weekly business hours in the location's local timezone. May
            be null when not configured upstream.
        partnerLocationId:
          type: string
          description: Location id on the partner's side
        locationSettings:
          type: object
          additionalProperties: {}
          description: Location custom settings
    LeadData:
      type: object
      required:
      - partnerLeadId
      - firstName
      - lastName
      - phoneNumber
      properties:
        kenectLeadId:
          type: integer
          format: int64
          description: Lead id in Kenect's system
        partnerLeadId:
          type: string
          examples:
          - L-123
          pattern: \S
          description: Lead id in partner's system
        firstName:
          type: string
          examples:
          - John
          pattern: \S
          description: Lead contact's first name
        lastName:
          type: string
          examples:
          - Doe
          pattern: \S
          description: Lead contact's last name
        phoneNumber:
          type: string
          examples:
          - "+15555555555"
          pattern: \S
          description: "Lead contact's phone number<br>Must follow the 'North American\
            \ phone numbers' or 'International phone numbers' standards<br>IE. +15555555555,\
            \ (555)555-5555"
        email:
          type: string
          description: Lead contact's email address
        inquiryText:
          type: string
          description: Lead's message
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/Attachment"
          description: ' List of attachments uploaded using the pre-signed url api.'
    LeadDispositionTemplateData:
      type: object
      required:
      - partnerLeadId
      - leadSource
      - messageBody
      properties:
        partnerLeadId:
          type: string
          pattern: \S
        leadSource:
          type: string
          pattern: \S
        inbound:
          type: boolean
        messageBody:
          type: string
          pattern: \S
        fromNumber:
          type: string
        toNumber:
          type: string
    LeadTemplateData:
      type: object
      required:
      - firstName
      - lastName
      - phoneNumber
      properties:
        firstName:
          type: string
          pattern: \S
        lastName:
          type: string
          pattern: \S
        phoneNumber:
          type: string
          pattern: \S
        email:
          type: string
        inquiryText:
          type: string
        partnerLocationId:
          type: string
    MessageContextOption:
      type: object
      required:
      - id
      - displayName
      - type
      description: "POJO that represents a message context (Case, Matter, Deal, etc.)"
      properties:
        id:
          type: string
          examples:
          - 0001Case
          pattern: \S
          description: "Message context ID on partner's side, for example, a Case\
            \ ID"
        displayName:
          type: string
          examples:
          - 0001Case - John Doe's case
          pattern: \S
          description: A name to be displayed into Kenect's platform that could help
            users to identify what context is this
        type:
          type: string
          examples:
          - CASE
          pattern: \S
          description: "Message Context type. For example [CASE, MATTER, DEAL, ACCOUNT]"
    MessageData:
      type: object
      required:
      - contactPhone
      properties:
        id:
          type: integer
          format: int64
          examples:
          - 123
          description: The message id in Kenect system
        conversationId:
          type: integer
          format: int64
          examples:
          - 123
          description: The conversation id in Kenect system
        contactName:
          type: string
          examples:
          - John Doe
          description: The contact full name
        contactPhone:
          type: string
          examples:
          - "+15555555555"
          pattern: \S
          description: "Contact's phone number<br>Must follow the 'North American\
            \ phone numbers' or 'International phone numbers' standards<br>IE. +15555555555,\
            \ (555)555-5555"
        messageBody:
          type: string
          description: The message to be sent
        externalContactId:
          type: string
          examples:
          - "123"
          description: "The customer id in partner's system<br>IE. 123, 'ABC-987'<br>The\
            \ same id is the <code>contactExternalId</code> query parameter of GET\
            \ /api/v1/messages/conversations/by-contact-external-id"
        sentByUserEmail:
          type: string
          examples:
          - "123"
          description: The message senders email
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/Attachment"
          description: The list of attachments previously uploaded using the pre-sign
            url API. The send response echoes the attachments submitted in the request
            (null when none were sent); read the message to get the stored attachment
            details.
        status:
          type: string
          readOnly: true
          enum:
          - DELIVERED
          - FACEBOOK_SYNC
          - FAILED
          - NO_STATUS_SET
          - RECEIVED
          - SENT
          - SENDING
          - UNDELIVERED
          - BLOCKED
          description: The status of the message sent from within Kenect
    MessageTemplateData:
      type: object
      required:
      - contactPhone
      - messageBody
      - externalContactId
      properties:
        id:
          type: integer
          format: int64
        conversationId:
          type: integer
          format: int64
        contactPhone:
          type: string
          pattern: \S
        messageBody:
          type: string
          pattern: \S
        externalContactId:
          type: string
          pattern: \S
        outbound:
          type: boolean
        partnerLocationId:
          type: string
    OemLocationData:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Location id in Kenect's system
        organizationId:
          type: integer
          format: int64
          description: Organization id in Kenect's system
        locationName:
          type: string
          description: Location name
        address:
          type: string
          description: Location address line 1
        address2:
          type: string
          description: Location address line 2
        city:
          type: string
          description: Location city
        state:
          type: string
          description: Location state
        zip:
          type: string
          description: Location zipcode
        phone:
          type: string
          description: Location phone number
        timezone:
          type: string
          description: IANA timezone of the location (e.g. America/Chicago). May be
            null when not configured upstream.
        businessHours:
          type: array
          items:
            $ref: "#/components/schemas/BusinessHours"
          description: Weekly business hours in the location's local timezone. May
            be null when not configured upstream.
        brandDealerInfo:
          type: array
          items:
            $ref: "#/components/schemas/BrandDealerInfo"
          description: List of dealer information
    PartnerContactTemplateData:
      type: object
      required:
      - phoneNumber
      - partnerContactId
      - partnerLocationId
      properties:
        phoneNumber:
          type: string
          pattern: \S
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        createdDate:
          type: integer
          format: int64
        updatedDate:
          type: integer
          format: int64
        partnerContactId:
          type: string
          pattern: \S
        partnerLocationId:
          type: string
          pattern: \S
    PartnerLeadTemplateData:
      type: object
      required:
      - firstName
      - lastName
      - phoneNumber
      - partnerLeadId
      properties:
        firstName:
          type: string
          pattern: \S
        lastName:
          type: string
          pattern: \S
        phoneNumber:
          type: string
          pattern: \S
        email:
          type: string
        inquiryText:
          type: string
        partnerLocationId:
          type: string
        partnerLeadId:
          type: string
          pattern: \S
    PartnerMessageTemplateData:
      type: object
      required:
      - contactPhone
      - messageBody
      - externalContactId
      properties:
        id:
          type: integer
          format: int64
        conversationId:
          type: integer
          format: int64
        contactPhone:
          type: string
          pattern: \S
        messageBody:
          type: string
          pattern: \S
        externalContactId:
          type: string
          pattern: \S
        outbound:
          type: boolean
        partnerLocationId:
          type: string
        partnerMessageId:
          type: string
    PartnerPaginatedResultsGroupMessage:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/GroupMessage"
          description: List of the requested resource
        currentPage:
          type: integer
          format: int32
          description: Current page number
        pageSize:
          type: integer
          format: int32
          description: Amount of records in the page
        totalPages:
          type: integer
          format: int32
          description: Total amount of pages
        totalRecords:
          type: integer
          format: int32
          description: Total amount of records
    PaymentAction:
      type: string
      enum:
      - COMPLETED
      - REFUNDED
    PaymentLinkData:
      type: object
      properties:
        paymentRequestLink:
          type: string
        dealerPaymentRequestDetailsLink:
          type: string
    PaymentLinkRequestData:
      type: object
      required:
      - invoiceId
      - amount
      - firstName
      - lastName
      - phoneNumber
      properties:
        invoiceId:
          type: string
          examples:
          - "123"
          description: "An unique key which identify the invoice on partner's system.<br>IE.\
            \ Invoice #, Service #, etc.<br>123, 'INV-000','123-456'"
        description:
          type: string
          examples:
          - "123"
          description: An invoice description
        amount:
          type: number
          exclusiveMinimum: 0
          description: The invoice's value to be reiceved
          multipleOf: 0.01
        firstName:
          type: string
          pattern: \S
          description: Customer's first name
        lastName:
          type: string
          pattern: \S
          description: Customer's last name
        phoneNumber:
          type: string
          examples:
          - "+15555555555"
          pattern: \S
          description: "Customer's phone number<br>Must follow the 'North American\
            \ phone numbers' or 'International phone numbers' standards<br>IE. +15555555555,\
            \ (555)555-5555"
        email:
          type: string
          description: Customer's email
    PostInvoiceUpdateBody:
      type: object
      properties:
        invoiceId:
          type: string
          description: The identifier of the invoice for which this payment was processed
        partnerLocationId:
          type: string
          description: The identifier of the location/office that processed the payment
        paymentAmount:
          type: number
          format: double
          description: The amount collected or refunded
        paymentDate:
          type: string
          description: The date and time of the payment update in iso 8601 format
        processorTransactionId:
          type: string
          description: The transactionId from the payment processor
        action:
          $ref: "#/components/schemas/PaymentAction"
          type: string
          description: The action taken
    PostInvoiceUpdateResponse:
      type: object
      properties:
        paymentId:
          type: string
          description: The identifier of the record generated in response to this
            payment update
    PreSignedUrl:
      type: object
      required:
      - url
      - path
      properties:
        url:
          type: string
          description: |-
            Signed URL to upload the file to. Upload it with an HTTP PUT whose body is the raw file bytes.
            The Content-Type and Content-Length headers must match the ones sent in this pre-sign request exactly (they are part of the signature); a mismatch, or any method other than PUT, is rejected with 403 SignatureDoesNotMatch. The URL expires 10 minutes after it is issued.
        path:
          type: string
          description: "Use it as `attachments[].name` when sending the message with\
            \ the uploaded file."
    PreSignedUrlData:
      type: object
      required:
      - contentLength
      - contentType
      - fileName
      properties:
        contentLength:
          type: integer
          exclusiveMinimum: 0
          format: int64
          description: File size in bytes. Max size is 524_288_000 (500MB) per file.
        contentType:
          type: string
          examples:
          - image/jpeg
          pattern: \S
          description: "File mime-type. Determined by the file contents.\n- application/msword\n\
            - application/pdf\n- application/rtf\n- application/vnd.ms-excel\n- application/vnd.ms-powerpoint\n\
            - application/vnd.oasis.opendocument.presentation\n- application/vnd.oasis.opendocument.spreadsheet\n\
            - application/vnd.oasis.opendocument.text\n- application/vnd.openxmlformats-officedocument.presentationml.presentation\n\
            - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet\n\
            - application/vnd.openxmlformats-officedocument.wordprocessingml.document\n\
            - application/zip\n- audio/3gpp\n- audio/3gpp2\n- audio/ac3\n- audio/amr\n\
            - audio/amr-nb\n- audio/basic\n- audio/L24\n- audio/mp4\n- audio/mpeg\n\
            - audio/ogg\n- audio/vnd.rn-realaudio\n- audio/vnd.wave\n- audio/vorbis\n\
            - audio/webm\n- image/bmp\n- image/gif\n- image/jpeg\n- image/png\n- text/calendar\n\
            - text/csv\n- text/directory\n- text/richtext\n- text/rtf\n- text/vcard\n\
            - text/x-vcard\n- video/3gpp\n- video/3gpp-tt\n- video/3gpp2\n- video/H261\n\
            - video/H263\n- video/H263-1998\n- video/H263-2000\n- video/H264\n- video/mp4\n\
            - video/mpeg\n- video/quicktime\n- video/webm \n"
        fileName:
          type: string
          examples:
          - file.jpeg
          pattern: \S
          description: File name + extension
    SendReviewData:
      type: object
      required:
      - phoneNumber
      - messageBody
      properties:
        externalContactId:
          type: string
          examples:
          - "123"
          description: "The customer id in partner's system<br>IE. 123, 'ABC-987'"
        firstName:
          type: string
          examples:
          - Doe
          description: Customer's first name
        lastName:
          type: string
          examples:
          - Doe
          description: Customer's last name
        phoneNumber:
          type: string
          examples:
          - "+15555555555"
          pattern: \S
          description: "Customer's phone number<br>Must follow the 'North American\
            \ phone numbers' or 'International phone numbers' standards<br>IE. +15555555555,\
            \ (555)555-5555"
        messageBody:
          type: string
          pattern: \S
          description: The message to be sent with the review request
        email:
          type: string
          description: Customer's email
    SendReviewResponseData:
      type: object
      properties:
        requestCreated:
          type: boolean
          examples:
          - true
          description: The indicator of if the request was created or not
        reviewRequestId:
          type: integer
          format: int64
          examples:
          - 664849
          description: The new review request ID created
        shortUrl:
          type: string
          description: The short URL of the review request
        locationId:
          type: integer
          format: int64
          examples:
          - 24685
          description: The ID of the Kenect location where the review was requested
        sendMethod:
          type: string
          examples:
          - TEXT_MESSAGE
          description: The indicator of if the request was created or not
        message:
          type: string
          examples:
          - Some text
          description: The message that was sent together with the review request
        sendAt:
          type: string
          format: date-time
          examples:
          - 2022-03-10T16:15:50Z
          description: The date and time of when the review request was sent to the
            customer
    SubscriptionData:
      type: object
      required:
      - eventName
      - url
      properties:
        eventName:
          type: string
          enum:
          - TEXT_MESSAGE_UPDATE
          - PUSH_LEAD
          examples:
          - TEXT_MESSAGE_UPDATE
          pattern: \S
          description: "The event your system is subscribing to, using the exact event\
            \ name (case sensitive). Supported events: TEXT_MESSAGE_UPDATE, PUSH_LEAD."
        url:
          type: string
          pattern: \S
          description: The URL of your system Kenect will send the event notification.
    TemplateEventPollResponse:
      type: object
      properties:
        customerId:
          type: string
          description: The identifier of the customer designated as the person to
            be notified of an event
        partnerLocationId:
          type: string
          description: The identifier of the business location or office generating
            the event
        recordId:
          type: string
          description: The identifier of the record associated with the event
        status:
          type: string
          description: "The status of the record that triggered the event (created,\
            \ closed, completed, etc)"
        statusChangedDate:
          type: string
          description: The date the record entered its current status
    TemplateInvoiceEventPollResponse:
      type: object
      properties:
        customerId:
          type: string
          description: The identifier of the customer designated as the person responsible
            for payment of the invoice
        partnerLocationId:
          type: string
          description: The identifier of the business location or office issuing the
            invoice
        invoiceId:
          type: string
          description: The identifier of the invoice for which payment should be requested
        status:
          type: string
          description: "The status of the invoice (approved, awaiting_payment, overdue,\
            \ etc)"
        statusChangedDate:
          type: string
          description: The date the invoice entered its current status
        invoiceAmountDue:
          type: number
          format: double
          description: The current amount due from the customer
        isoDueDate:
          type: string
          description: The date by which the payment is required to be made in iso
            8601 format
        description:
          type: string
          description: The description to be included when the payment request is
            sent to the customer
        invoiceUrl:
          type: string
          description: A URL which will allow the customer to access their invoice
            directly
        invoicePasscode:
          type: string
          description: "A passcode, if required, the customer will use to gain access\
            \ to their invoice"
        merchantAccountType:
          type: string
          description: "The type of account to which collected funds should be directed\
            \ (operating, trust, etc)"
    UserData:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        inactiveDate:
          type: integer
          format: int64
        departmentId:
          type: integer
          format: int64
        messageSignature:
          type: string
        includeSignature:
          type: boolean
    WebFormLeadMessage:
      type: object
      required:
      - brandId
      - dealerId
      - senderPhone
      - senderName
      - messageBody
      properties:
        brandId:
          type: string
          examples:
          - 5y1jkg
          pattern: \S
          description: The brand's identifier. This is an id provided by Kenect
        dealerId:
          type: string
          examples:
          - D-0145
          pattern: \S
          description: The dealer's identifier
        senderPhone:
          type: string
          examples:
          - "+15555555555"
          pattern: \S
          description: "Lead contact's phone number<br>Must follow the 'North American\
            \ phone numbers' or 'International phone numbers' standards<br>IE. +15555555555,\
            \ (555)555-5555"
        senderName:
          type: string
          examples:
          - John Doe
          pattern: \S
          description: Lead's name
        messageBody:
          type: string
          examples:
          - "Hi, I'm interested on this car"
          pattern: \S
          description: Lead's message
        webFormUrl:
          type: string
          description: The URL where the lead was generated
        leadId:
          type: string
          description: Lead id in partner's system
        metaData:
          type: object
          examples:
          - vehicle:
              model: New model
              year: "2023"
              color: Black
            promotion:
              code: PROMOTION_CODE
              expirationDate: 2023-04-04
          additionalProperties: {}
          description: A json containing any extra lead information
  securitySchemes:
    apiKey:
      type: apiKey
      name: X-Api-Key
      in: header
    apiSecret:
      type: apiKey
      name: X-Api-Secret
      in: header
    locationId:
      type: apiKey
      description: Kenect location id. Preferred way to select the location. Send
        this or X-Partner-Location-Id on every endpoint except GET /api/v1/locations.
      name: X-Location-Id
      in: header
    partnerLocationId:
      type: apiKey
      description: The location id in the partner's system. Alternative to X-Location-Id.
      name: X-Partner-Location-Id
      in: header
    partnerLocationZip:
      type: apiKey
      description: Only used to disambiguate when more than one location shares the
        X-Partner-Location-Id sent. Ignored otherwise. Prefer X-Location-Id.
      name: X-Partner-Location-Zip
      in: header
tags:
- name: Kenect Endpoints
  description: To be consumed by partners
- name: Partner Endpoint Templates
  description: To be implemented by partners and consumed by Kenect
paths:
  /api/v1/broadcast-messages:
    get:
      summary: Fetch broadcast messages from kenect
      operationId: fetchBroadcastMessages
      tags:
      - Kenect Endpoints
      parameters:
      - description: Filter with broadcast messages sent since this date
        example: 2022-01-01T00:00:00.000Z
        name: beginAt
        in: query
        schema:
          type: string
      - description: Filter with broadcast messages sent until this date
        example: 2022-01-01T00:00:00.000Z
        name: endAt
        in: query
        schema:
          type: string
      - description: "Amount of results per page. Default: 100"
        name: pageSize
        in: query
        schema:
          type: integer
          format: int32
          default: 100
      - description: "Page number to fetch. Default: 1"
        name: page
        in: query
        schema:
          type: integer
          format: int32
          default: 1
      responses:
        "200":
          description: Return the broadcast messages list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerPaginatedResultsGroupMessage"
        "401":
          description: Unauthorized
        "400":
          description: Invalid argument has been provided
        "403":
          description: Invalid API credentials
        "500":
          description: Error fetching broadcast messages
      security:
      - apiKey: []
      - apiSecret: []
      - locationId: []
      - partnerLocationId: []
      - partnerLocationZip: []
  /api/v1/contact/batch:
    post:
      summary: Send a batch of contacts to Kenect
      operationId: receiveContactBatch
      tags:
      - Kenect Endpoints
      requestBody:
        description: Json object with payment link request data
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactBatchData"
      responses:
        "200":
          description: Contacts received
          content:
            application/json:
              schema: {}
        "401":
          description: Unauthorized
        "403":
          description: Invalid API credentials
        "500":
          description: Failed to process contact batch
        "400":
          description: Bad Request
      security:
      - apiKey: []
      - apiSecret: []
      - locationId: []
      - partnerLocationId: []
      - partnerLocationZip: []
  /api/v1/credentials/me:
    get:
      summary: Me endpoint to get the information about the current session. You can
        use this endpoint to test your credentials.
      operationId: getSessionCredentials
      tags:
      - Kenect Endpoints
      parameters:
      - description: Kenect location id. Send this or X-Partner-Location-Id; this
          one is preferred.
        in: header
        name: X-Location-Id
      - description: The location id in the partner's system. Alternative to X-Location-Id.
        in: header
        name: X-Partner-Location-Id
      - description: Only used to disambiguate when more than one location shares
          the X-Partner-Location-Id sent. Ignored otherwise.
        in: header
        name: X-Partner-Location-Zip
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
        "401":
          description: Unauthorized
        "403":
          description: Invalid API credentials
        "500":
          description: Failed to process credentials
      security:
      - apiKey: []
      - apiSecret: []
  /api/v1/events/notify:
    post:
      summary: Notify Kenect about an event
      operationId: notifyEvent
      tags:
      - Kenect Endpoints
      requestBody:
        description: Json object with event notification data
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventNotificationData"
      responses:
        "202":
          description: Message Successfully Queued
        "401":
          description: Unauthorized
        "403":
          description: Invalid API credentials
        "412":
          description: Preconditions failed
        "500":
          description: Failed to notify event
        "400":
          description: Bad Request
      security:
      - apiKey: []
      - apiSecret: []
      - locationId: []
      - partnerLocationId: []
      - partnerLocationZip: []
  /api/v1/lead:
    post:
      summary: Submit a new lead
      operationId: sendLead
      tags:
      - Kenect Endpoints
      requestBody:
        description: Json object with lead data
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadData"
      responses:
        "200":
          description: Lead Received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboundLeadResponse"
        "401":
          description: Unauthorized
        "403":
          description: Invalid API credentials
        "500":
          description: Failed to process lead
        "400":
          description: Bad Request
      security:
      - apiKey: []
      - apiSecret: []
      - locationId: []
      - partnerLocationId: []
      - partnerLocationZip: []
    get:
      summary: Fetch leads from kenect
      operationId: getLeads
      tags:
      - Kenect Endpoints
      parameters:
      - description: "Filter leads created since this date, if not supplied, the application\
          \ will consider the last 7 days."
        example: 2022-01-01T00:00:00.000Z
        name: startDate
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          format: int32
      - name: offset
        in: query
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: Return the leads list
          content:
            application/json:
              schema: {}
        "204":
          description: No leads found
        "401":
          description: Unauthorized
        "403":
          description: Invalid API credentials
        "500":
          description: Error fetching leads
      security:
      - apiKey: []
      - apiSecret: []
      - locationId: []
      - partnerLocationId: []
      - partnerLocationZip: []
  /api/v1/locations:
    get:
      summary: Get a list of active locations
      operationId: getLocations
      tags:
      - Kenect Endpoints
      parameters:
      - description: "Optional organization id to filter the returned locations by.\
          \ When omitted, all locations authorized for the API token are returned."
        name: organizationId
        in: query
        schema:
          type: string
      responses:
        "200":
          description: Active Location List
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IntegrationLocationData"
        "400":
          description: Invalid organizationId
        "401":
          description: Unauthorized
        "403":
          description: Invalid API credentials
      security:
      - apiKey: []
      - apiSecret: []
  /api/v1/locations/partner-location/{partnerLocationId}/zip-code/{zipCode}:
    get:
      summary: Get a single location matching the partnerLocationId and the zipCode
      operationId: findLocationByParentLocationIdAndZipCode
      tags:
      - Kenect Endpoints
      parameters:
      - description: Kenect location id. Send this or X-Partner-Location-Id; this
          one is preferred.
        in: header
        name: X-Location-Id
      - description: The location id in the partner's system. Alternative to X-Location-Id.
        in: header
        name: X-Partner-Location-Id
      - description: Only used to disambiguate when more than one location shares
          the X-Partner-Location-Id sent. Ignored otherwise.
        in: header
        name: X-Partner-Location-Zip
      - name: partnerLocationId
        in: path
        required: true
        schema:
          type: string
      - name: zipCode
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Single active Location by partnerLocationId and zipCode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationLocationData"
        "401":
          description: Unauthorized
        "403":
          description: Invalid API credentials
        "404":
          description: No location found for provided partnerLocationId and ZipCode
      security:
      - apiKey: []
      - apiSecret: []
  /api/v1/messages:
    post:
      summary: Send a custom message to a contact
      operationId: sendMessage
      tags:
      - Kenect Endpoints
      requestBody:
        description: Json object with message data
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageData"
        required: true
      responses:
        "200":
          description: Message Successfully Sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageData"
        "401":
          description: Unauthorized
        "403":
          description: Invalid API credentials
        "500":
          description: Error sending custom message
        "400":
          description: Bad Request
      security:
      - apiKey: []
      - apiSecret: []
      - locationId: []
      - partnerLocationId: []
      - partnerLocationZip: []
    get:
      summary: Fetch conversations from kenect
      operationId: getConversations
      tags:
      - Kenect Endpoints
      parameters:
      - description: Filter conversations with messages sent since this date
        example: 2022-01-01T00:00:00.000Z
        name: beginAt
        in: query
        schema:
          type: string
      - description: Filter conversations with messages sent until this date
        example: 2022-01-01T00:00:00.000Z
        name: endAt
        in: query
        schema:
          type: string
      - description: "Amount of results per page. Default: 100"
        name: limit
        in: query
        schema:
          type: integer
          format: int64
      - description: "Amount of results to skip. Default: 0"
        name: offset
        in: query
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Return the conversation list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InboxConversationData"
        "204":
          description: No conversations found
        "401":
          description: Unauthorized
        "403":
          description: Invalid API credentials
        "500":
          description: Error fetching conversations
      security:
      - apiKey: []
      - apiSecret: []
      - locationId: []
      - partnerLocationId: []
      - partnerLocationZip: []
  /api/v1/messages/attachment-info:
    get:
      summary: Fetch attachment information from kenect
      operationId: getAttachmentInfo
      tags:
      - Kenect Endpoints
      parameters:
      - description: The attachment id in Kenect
        name: attachmentId
        in: query
        schema:
          type: integer
          format: int64
      - description: The message id in Kenect
        name: messageId
        in: query
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Return the attachment information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentInfo"
        "204":
          description: No attachment information found
        "401":
          description: Unauthorized
        "403":
          description: Invalid API credentials
        "500":
          description: Error fetching the attachment information
      security:
      - apiKey: []
      - apiSecret: []
      - locationId: []
      - partnerLocationId: []
      - partnerLocationZip: []
  /api/v1/messages/by-phone-number:
    get:
      summary: Fetch conversation messages from phone number
      operationId: getConversationsWithMessagesByContactPhone
      tags:
      - Kenect Endpoints
      parameters:
      - description: Valid Phone number to search its conversations
        name: phoneNumber
        in: query
        schema:
          type: string
      - description: "Number of records to skip. Default: 0"
        name: offset
        in: query
        schema:
          type: integer
          format: int32
          default: 0
      - description: "Number of records per page. Default: 100, Max: 100"
        name: limit
        in: query
        schema:
          type: integer
          format: int32
          default: 100
      responses:
        "200":
          description: Return the message list (empty when there are none)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiConversationMessage"
        "401":
          description: Unauthorized
        "403":
          description: Invalid API credentials
        "500":
          description: Error fetching messages
      security:
      - apiKey: []
      - apiSecret: []
      - locationId: []
      - partnerLocationId: []
      - partnerLocationZip: []
  /api/v1/messages/conversations/by-contact-external-id:
    get:
      summary: Fetch conversations with messages by external contact id
      operationId: getConversationsWithMessagesByContactExternalId
      tags:
      - Kenect Endpoints
      parameters:
      - description: The contact id in the partner system. It is the same id that
          the send payload (POST /api/v1/messages) calls <code>externalContactId</code>
        name: contactExternalId
        in: query
        schema:
          type: string
      - description: "Number of records to skip. Default: 0"
        name: offset
        in: query
        schema:
          type: integer
          format: int32
      - description: "Number of records per page. Default: 100, Max: 100"
        name: limit
        in: query
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: Return the conversation list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InboxConversationData"
        "401":
          description: Unauthorized
        "403":
          description: Invalid API credentials
        "404":
          description: No contact found for the external contact id
        "500":
          description: Error fetching conversations
      security:
      - apiKey: []
      - apiSecret: []
      - locationId: []
      - partnerLocationId: []
      - partnerLocationZip: []
  /api/v1/messages/conversations/by-phone-number:
    get:
      summary: Fetch the conversation with the messages from the given phone number
      operationId: getConversationDataByPhoneNumber
      tags:
      - Kenect Endpoints
      parameters:
      - description: Valid Phone number to search its conversations
        name: phoneNumber
        in: query
        schema:
          type: string
      - description: "Number of message records to skip. Default: 0"
        name: offset
        in: query
        schema:
          type: integer
          format: int32
          default: 0
      - description: "Number of message records per page. Default: 100, Max: 100"
        name: limit
        in: query
        schema:
          type: integer
          format: int32
          default: 100
      responses:
        "200":
          description: "Return the conversation data with messages. When the conversation\
            \ has no contact linked, an empty conversation is returned (id 0, null\
            \ fields, no messages)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxConversationData"
        "204":
          description: No conversation found for the phone number
        "401":
          description: Unauthorized
        "403":
          description: Invalid API credentials
        "500":
          description: Error fetching conversation
      security:
      - apiKey: []
      - apiSecret: []
      - locationId: []
      - partnerLocationId: []
  /api/v1/messages/review-request:
    post:
      summary: Send a review request to a contact.
      deprecated: true
      operationId: sendMessageReviewRequest
      tags:
      - Kenect Endpoints
      requestBody:
        description: Json object with review request data
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageData"
        required: true
      responses:
        "200":
          description: Review Request Successfully Sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageData"
        "401":
          description: Unauthorized
        "403":
          description: Invalid API credentials
        "500":
          description: Error sending review request message
        "400":
          description: Bad Request
      security:
      - apiKey: []
      - apiSecret: []
      - locationId: []
      - partnerLocationId: []
      - partnerLocationZip: []
  /api/v1/oem/lead:
    post:
      summary: Submit a new OEM branded lead
      operationId: sendBrandedLead
      tags:
      - Kenect Endpoints
      requestBody:
        description: Json object with lead data
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebFormLeadMessage"
      responses:
        "204":
          description: Lead Received
        "400":
          description: Invalid lead
        "401":
          description: Unauthorized
        "403":
          description: Invalid API credentials
        "500":
          description: Failed to process lead
      security:
      - apiKey: []
      - apiSecret: []
      - locationId: []
      - partnerLocationId: []
      - partnerLocationZip: []
  /api/v1/oem/locations:
    get:
      summary: Get a list of active OEM locations
      operationId: getOemLocations
      tags:
      - Kenect Endpoints
      responses:
        "200":
          description: Active Location List
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OemLocationData"
        "401":
          description: Unauthorized
        "403":
          description: Invalid API credentials
      security:
      - apiKey: []
      - apiSecret: []
  /api/v1/payment/linkRequest:
    post:
      summary: Request a payment link
      operationId: generatePaymentLink
      tags:
      - Kenect Endpoints
      requestBody:
        description: Json object with payment link request data
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentLinkRequestData"
      responses:
        "200":
          description: 'Payment Link Generated '
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentLinkData"
        "401":
          description: Unauthorized
        "403":
          description: Invalid API credentials
        "500":
          description: Error generating payment link
        "400":
          description: Bad Request
      security:
      - apiKey: []
      - apiSecret: []
      - locationId: []
      - partnerLocationId: []
      - partnerLocationZip: []
  /api/v1/resources/presign-url:
    post:
      summary: Create a pre-signed URL to upload a file.
      operationId: createPreSignedUploadUrl
      tags:
      - Kenect Endpoints
      requestBody:
        description: Json object with data to create the pre-signed URL.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreSignedUrlData"
      responses:
        "200":
          description: Create a pre-signed URL to upload a file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreSignedUrl"
        "401":
          description: Unauthorized.
        "400":
          description: Invalid parameter(s). Please check parameters and try again.
        "403":
          description: Invalid API credentials.
        "500":
          description: Failed to process request to create pre-signed url.
      security:
      - apiKey: []
      - apiSecret: []
      - locationId: []
      - partnerLocationId: []
      - partnerLocationZip: []
  /api/v1/reviews/review-request:
    post:
      summary: Send a review request to a contact.
      operationId: sendRequestReview
      tags:
      - Kenect Endpoints
      requestBody:
        description: Json object with review request data
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendReviewData"
      responses:
        "200":
          description: Review Request Successfully Sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendReviewResponseData"
        "401":
          description: Unauthorized
        "403":
          description: Invalid API credentials
        "500":
          description: Error sending review request message
        "400":
          description: Bad Request
      security:
      - apiKey: []
      - apiSecret: []
      - locationId: []
      - partnerLocationId: []
      - partnerLocationZip: []
  /api/v1/subscriptions:
    post:
      summary: Create a webhook subscription.
      description: |-
        Subscribes a URL to an event. Subscriptions require prior configuration on Kenect's side: contact the Kenect integrations team before using this endpoint.
        A subscription belongs to the integration and the location of the request, so create one per location.
        Supported events: TEXT_MESSAGE_UPDATE and PUSH_LEAD; any other event is rejected with 400.
        Keep the returned id: there is no endpoint to list subscriptions, and it is required to delete one.
      operationId: createSubscription
      tags:
      - Kenect Endpoints
      requestBody:
        description: Json object with the webhook information to be stored.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionData"
      responses:
        "200":
          description: The webhook subscription has been created successfully. The
            response contains the subscription id.
          content:
            application/json:
              schema:
                type: object
        "401":
          description: Unauthorized.
        "400":
          description: Invalid parameter(s). Please check parameters and try again.
        "403":
          description: Invalid API credentials.
        "500":
          description: Failed to process request to create the webhook subscription.
      security:
      - apiKey: []
      - apiSecret: []
      - locationId: []
      - partnerLocationId: []
      - partnerLocationZip: []
  /api/v1/subscriptions/{id}:
    delete:
      summary: Delete the webhook subscription.
      operationId: deleteSubscription
      tags:
      - Kenect Endpoints
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The webhook subscription has been deleted.
          content:
            application/json:
              schema: {}
        "401":
          description: Unauthorized.
        "400":
          description: Invalid parameter(s). Please check parameters and try again.
        "403":
          description: Invalid API credentials.
        "500":
          description: Failed to process request to delete the webhook subscription.
      security:
      - apiKey: []
      - apiSecret: []
      - locationId: []
      - partnerLocationId: []
      - partnerLocationZip: []
  /api/v1/template/contact:
    post:
      summary: Update an existing contact
      operationId: addOrUpdatecontact
      tags:
      - Partner Endpoint Templates
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartnerContactTemplateData"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerContactTemplateData"
        "400":
          description: Bad Request
  /api/v1/template/contact/batch:
    get:
      summary: Retrieve a batch of contacts based on the filters sent with the request
      operationId: retrieveContactBatch
      tags:
      - Partner Endpoint Templates
      parameters:
      - name: createdDate
        in: query
        schema:
          type: integer
          format: int64
      - name: limit
        in: query
        schema:
          type: integer
          format: int32
        required: true
      - name: offset
        in: query
        schema:
          type: integer
          format: int32
        required: true
      - name: partnerLocationId
        in: query
        schema:
          type: string
        required: true
      - name: updatedDate
        in: query
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactBatchResponseTemplateData"
  /api/v1/template/credentials/validate:
    get:
      summary: Validate the given credentials to ensure it is valid
      operationId: validateCredentials
      tags:
      - Partner Endpoint Templates
      responses:
        "200":
          description: API credentials are ok
          content:
            application/json:
              schema: {}
        "401":
          description: Unauthorized
        "403":
          description: Invalid API credentials
  /api/v1/template/event/invoice:
    get:
      summary: Fetch invoices which should trigger payment requests by status and
        dueDate OR by status and statusChangedDate
      operationId: getPaymentTriggerEvents
      tags:
      - Partner Endpoint Templates
      parameters:
      - description: "The date on which the invoice is due to be paid in ISO 8601\
          \ format. Used to get invoices prior to, on, or after they are due."
        name: isoDueDate
        in: query
        schema:
          type: string
      - description: The date the invoice entered its current status in ISO 8601 format.
          Used to filter for newly available invoices only.
        name: isoStatusChangedDate
        in: query
        schema:
          type: string
      - description: The status of the invoice requiring payment. Used to pull invoices
          for which payment requests or messages should be sent.
        name: status
        in: query
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateInvoiceEventPollResponse"
  /api/v1/template/event/invoice/payment-update:
    post:
      summary: Post invoice payment update to partner
      operationId: postInvoiceUpdate
      tags:
      - Partner Endpoint Templates
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostInvoiceUpdateBody"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostInvoiceUpdateResponse"
        "400":
          description: Bad Request
  /api/v1/template/event/record:
    get:
      summary: Fetch system records which should be used to trigger automated messages
      operationId: getMessageTriggerEvents
      tags:
      - Partner Endpoint Templates
      parameters:
      - description: The date the record entered its current status in ISO 8601 format.
          Used to filter for newly available records only.
        name: isoStatusChangedDate
        in: query
        schema:
          type: string
      - description: The status of the record. Used to pull records for which messages
          should be sent.
        name: status
        in: query
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateEventPollResponse"
  /api/v1/template/lead:
    post:
      summary: Add new Lead
      operationId: addNewLeadTemplate
      tags:
      - Partner Endpoint Templates
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadTemplateData"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerLeadTemplateData"
        "400":
          description: Bad Request
  /api/v1/template/lead/disposition:
    post:
      summary: Add new Lead Disposition
      operationId: addNewLeadDispositionTemplate
      tags:
      - Partner Endpoint Templates
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadDispositionTemplateData"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadDispositionTemplateData"
        "400":
          description: Bad Request
  /api/v1/template/location/check:
    get:
      summary: Validate location
      operationId: validatePartnerLocationId
      tags:
      - Partner Endpoint Templates
      parameters:
      - name: partnerLocationId
        in: query
        schema:
          type: string
        required: true
      - name: zipCode
        in: query
        schema:
          type: string
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: boolean
  /api/v1/template/message:
    post:
      summary: Push Message
      operationId: pushMessage
      tags:
      - Partner Endpoint Templates
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageTemplateData"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerMessageTemplateData"
        "400":
          description: Bad Request
  /api/v1/template/message-context:
    get:
      summary: Gets a list of message contexts that are tied to the contactId
      operationId: getMessageContext
      tags:
      - Partner Endpoint Templates
      parameters:
      - description: Contact ID on the partner's side
        in: query
        name: contactId
        schema:
          type: string
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MessageContextOption"
  /api/v1/users:
    get:
      summary: Get all users from the organization
      operationId: getAllUsers
      tags:
      - Kenect Endpoints
      parameters:
      - description: Kenect location id. Send this or X-Partner-Location-Id; this
          one is preferred.
        in: header
        name: X-Location-Id
      - description: The location id in the partner's system. Alternative to X-Location-Id.
        in: header
        name: X-Partner-Location-Id
      - description: Only used to disambiguate when more than one location shares
          the X-Partner-Location-Id sent. Ignored otherwise.
        in: header
        name: X-Partner-Location-Zip
      - description: Set true to filter all the users by the location id
        name: filterByLocationId
        in: query
        schema:
          type: boolean
          default: false
      responses:
        "200":
          description: List of all users from organization
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserData"
        "401":
          description: Unauthorized
        "403":
          description: Invalid API credentials
      security:
      - apiKey: []
      - apiSecret: []
  /api/v1/users/{userId}:
    get:
      summary: Get user information by the user id
      operationId: getUser
      tags:
      - Kenect Endpoints
      parameters:
      - description: Kenect location id. Send this or X-Partner-Location-Id; this
          one is preferred.
        in: header
        name: X-Location-Id
      - description: The location id in the partner's system. Alternative to X-Location-Id.
        in: header
        name: X-Partner-Location-Id
      - description: Only used to disambiguate when more than one location shares
          the X-Partner-Location-Id sent. Ignored otherwise.
        in: header
        name: X-Partner-Location-Zip
      - description: Id of the user
        name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: User information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserData"
        "401":
          description: Unauthorized
        "404":
          description: User not found
        "403":
          description: Invalid API credentials
      security:
      - apiKey: []
      - apiSecret: []
