# A made-up API written for the harness's own tests; it describes no real provider.
openapi: 3.0.3
info:
  title: Conformance fixture
  version: "2026-01-01.fixture"
servers:
  - url: https://api.fixture.example/v1
security:
  - token: []
components:
  securitySchemes:
    token:
      type: http
      scheme: bearer
  schemas:
    Item:
      type: object
      required: [id, name]
      properties:
        id: {type: string}
        name: {type: string}
        size: {type: integer, minimum: 1}
    Page:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Item"}
paths:
  /items:
    get:
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100}
      responses:
        "200":
          description: A page of items
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Page"}
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 3}
      responses:
        "201":
          description: The new item
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Item"}
  /items/search:
    get:
      parameters:
        - name: q
          in: query
          required: true
          schema: {type: string, minLength: 3}
      responses:
        "200":
          description: Matching items
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Page"}
  /items/{item_id}:
    patch:
      parameters:
        - name: item_id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [size]
              properties:
                size: {type: integer, minimum: 1}
      responses:
        "200":
          description: The resized item
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Item"}
