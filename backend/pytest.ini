[pytest]
minversion = 6.0
addopts =
    -ra
    --strict-markers
    --strict-config
    -v
    -m "not integration"
    # libtmux's pytest plugin marks a fixture (rejected on pytest>=8.4) and this
    # suite uses none of its fixtures.
    -p no:libtmux
testpaths =
    tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
filterwarnings =
    ignore:.*aifc.*deprecated.*:DeprecationWarning
    ignore:.*audioop.*deprecated.*:DeprecationWarning
    ignore:.*PyPDF2.*:DeprecationWarning
    ignore:.*import python_multipart.*:PendingDeprecationWarning
    ignore:.*PydanticSerializationUnexpectedValue.*:UserWarning
    ignore:.*cannot schedule new futures after shutdown.*:pytest.PytestUnhandledThreadExceptionWarning
    ignore:.*There is no current event loop.*:DeprecationWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::ResourceWarning
