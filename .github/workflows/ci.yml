name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  community-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - run: make check-community-boundary

  vendored-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run vendored:check

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: make test-backend-community

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      SESSION_SECRET: ci-only-ephemeral-session-secret-not-for-deployment
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4^{}
        with:
          version: 10.34.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend typecheck
      - run: pnpm --dir frontend build
      - run: pnpm --dir frontend test

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4^{}
        with:
          version: 10.34.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt -r requirements-dev.txt
      - run: npm audit --omit=dev
      - name: Audit backend production dependencies
        run: |
          audit_output="$(pnpm --dir backend audit --prod --ignore-registry-errors 2>&1)" || {
            audit_status=$?
            printf '%s\n' "$audit_output"
            exit "$audit_status"
          }
          printf '%s\n' "$audit_output"
          if [[ "$audit_output" != *"No known vulnerabilities found"* ]]; then
            echo "::warning title=npm security audit unavailable::The registry could not complete the backend dependency audit; see the step log."
          fi
      - run: npm audit --omit=dev
        working-directory: sdk/typescript
      - name: Audit frontend production dependencies
        run: |
          audit_output="$(pnpm --dir frontend audit --prod --audit-level=high --ignore-registry-errors 2>&1)" || {
            audit_status=$?
            printf '%s\n' "$audit_output"
            exit "$audit_status"
          }
          printf '%s\n' "$audit_output"
          if [[ "$audit_output" != *"No known vulnerabilities found"* ]]; then
            echo "::warning title=npm security audit unavailable::The registry could not complete the frontend dependency audit; see the step log."
          fi

  typescript-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm ci
        working-directory: sdk/typescript
      - run: npm test
        working-directory: sdk/typescript
      - run: npm run build
        working-directory: sdk/typescript
