name: Publish SDK

# Publishes each SDK at the version its source names: sdk/typescript/package.json
# to npm, sdk/python/pyproject.toml to PyPI. A release is a commit that raises
# that version (package.json with its package-lock.json; pyproject.toml with
# noclick/_version.py), then a run of this workflow on main.
#
# Manual only, deliberately: publishing to a registry is a public act, and a
# commit to main must never start one. It refuses a version that isn't newer
# than every version the registry already has, so a run can't republish or go
# backwards. Publishing happens here, from the public repository, so what npm
# and PyPI receive is built from exactly what anyone can read here.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which SDK to publish"
        type: choice
        options: [typescript, python, both]
        default: typescript

permissions:
  contents: read

concurrency:
  # One release at a time: each run reads what the registries already have.
  group: sdk-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  detect-changes:
    # Only this repository's main branch publishes; a fork has no trusted publisher anyway.
    if: github.repository == 'noclickapp/noclick' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      typescript: ${{ steps.changes.outputs.typescript }}
      python: ${{ steps.changes.outputs.python }}
    steps:
      - id: changes
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          case "$TARGET" in
            typescript) echo "typescript=true"  >> "$GITHUB_OUTPUT"; echo "python=false" >> "$GITHUB_OUTPUT" ;;
            python)     echo "typescript=false" >> "$GITHUB_OUTPUT"; echo "python=true"  >> "$GITHUB_OUTPUT" ;;
            both)       echo "typescript=true"  >> "$GITHUB_OUTPUT"; echo "python=true"  >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::unsupported SDK target: $TARGET"; exit 1 ;;
          esac

  build-npm:
    needs: detect-changes
    if: needs.detect-changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm
        # OIDC trusted publishing requires npm >= 11.5.1; the runner ships npm 10.x.
        run: npm install -g npm@11.5.1

      - name: Check the version is newer than npm's
        working-directory: sdk/typescript
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          LOCKED=$(node -p "require('./package-lock.json').version")
          if [ "$LOCKED" != "$VERSION" ]; then
            echo "::error::package.json is version $VERSION but package-lock.json says $LOCKED"
            exit 1
          fi
          npm view noclick versions --json > "$RUNNER_TEMP/npm-versions.json"
          VERSION="$VERSION" LISTED="$RUNNER_TEMP/npm-versions.json" node <<'JS'
          const plain = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/;
          const parts = (v) => v.split(".").map(Number);
          const newer = (a, b) => {
            const [x, y] = [parts(a), parts(b)];
            for (let i = 0; i < 3; i++) if (x[i] !== y[i]) return x[i] > y[i];
            return false;
          };
          const own = process.env.VERSION;
          // One published version comes back as a string, more as a list.
          const listed = [].concat(JSON.parse(require("fs").readFileSync(process.env.LISTED, "utf8")));
          const fail = (why) => { console.log(`::error::${why}`); process.exit(1); };
          if (!plain.test(own)) fail(`sdk/typescript is version ${own}: publish plain X.Y.Z versions only`);
          const odd = listed.filter((v) => !plain.test(v));
          if (odd.length) fail(`npm lists versions this check cannot order: ${odd.join(", ")}`);
          const newest = listed.reduce((a, b) => (newer(b, a) ? b : a));
          if (!newer(own, newest)) fail(`sdk/typescript is version ${own}, and npm already has ${newest}: raise the version first`);
          console.log(`Publishing ${own}; npm has ${newest}.`);
          JS
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # scripts/check.sh builds the app too, which installs with the pnpm its package.json names.
      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Build and test everything
        run: scripts/check.sh

      - name: Check the packed licence is the SDK's own
        working-directory: sdk/typescript
        # npm packs sdk/typescript/LICENSE: it must be the Apache-2.0 text the package declares.
        run: head -n 2 LICENSE | grep -q 'Apache License'

      - name: Build
        working-directory: sdk/typescript
        run: node build.js

      - name: Pack the exact npm artifact
        working-directory: sdk/typescript
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/npm-package"
          mkdir -p "$package_dir"
          npm pack --ignore-scripts --pack-destination "$package_dir"
          shopt -s nullglob
          packages=("$package_dir"/*.tgz)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "::error::expected one npm tarball, found ${#packages[@]}"
            exit 1
          fi
          package_name="$(basename "${packages[0]}")"
          if [ "$package_name" != "noclick-$VERSION.tgz" ]; then
            echo "::error::packed $package_name, expected noclick-$VERSION.tgz"
            exit 1
          fi
          smoke_dir="$RUNNER_TEMP/npm-import-smoke"
          npm install --prefix "$smoke_dir" --ignore-scripts "${packages[0]}"
          (cd "$smoke_dir" && node --input-type=module -e "await import('noclick')")
          (cd "$package_dir" && sha256sum -- "$package_name" > SHA256SUMS)

      - name: Upload the reviewed npm artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: noclick-npm-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/npm-package/*.tgz
            ${{ runner.temp }}/npm-package/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  build-python:
    needs: detect-changes
    if: needs.detect-changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # scripts/check.sh tests the TypeScript SDK too, which checks its API against this one.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Check the version is newer than PyPI's
        working-directory: sdk/python
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          MODULE=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' noclick/_version.py)
          if [ -z "$VERSION" ] || [ "$MODULE" != "$VERSION" ]; then
            echo "::error::pyproject.toml is version '$VERSION' but noclick/_version.py says '$MODULE'"
            exit 1
          fi
          curl -fsSL https://pypi.org/pypi/noclick/json > "$RUNNER_TEMP/pypi.json"
          python - "$VERSION" "$RUNNER_TEMP/pypi.json" <<'PY'
          import json
          import re
          import sys

          own, path = sys.argv[1], sys.argv[2]
          plain = re.compile(r"^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$")


          def fail(why):
              print(f"::error::{why}")
              sys.exit(1)


          def parts(version):
              return tuple(int(part) for part in version.split("."))


          if not plain.match(own):
              fail(f"sdk/python is version {own}: publish plain X.Y.Z versions only")
          with open(path) as f:
              listed = list(json.load(f)["releases"])
          odd = [v for v in listed if not plain.match(v)]
          if odd:
              fail(f"PyPI lists versions this check cannot order: {', '.join(odd)}")
          newest = max(listed, key=parts)
          if parts(own) <= parts(newest):
              fail(f"sdk/python is version {own}, and PyPI already has {newest}: raise the version first")
          print(f"Publishing {own}; PyPI has {newest}.")
          PY
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # scripts/check.sh builds the app too, which installs with the pnpm its package.json names.
      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Build and test everything
        run: scripts/check.sh

      - name: Install build tool
        run: pip install build==1.3.0 twine==6.2.0

      - name: Build and verify the Python distributions
        working-directory: sdk/python
        run: |
          set -euo pipefail
          rm -rf dist
          python -m build
          shopt -s nullglob
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          if [ "${#wheels[@]}" -ne 1 ] || [ "${#sdists[@]}" -ne 1 ]; then
            echo "::error::expected one wheel and one sdist"
            exit 1
          fi
          python -m twine check "${wheels[0]}" "${sdists[0]}"
          (cd dist && sha256sum -- *.whl *.tar.gz > SHA256SUMS)
          python -m pip install --force-reinstall "${wheels[0]}"
          # Run outside the source tree so this imports the installed wheel,
          # not the adjacent ./noclick package.
          (cd "$RUNNER_TEMP" && python - <<'PY'
          import os
          import noclick

          assert noclick.__version__ == os.environ["VERSION"]
          PY
          )
          # Installing the exact sdist proves it builds and imports too, not only
          # the wheel built beside it.
          python -m pip install --force-reinstall "${sdists[0]}"
          (cd "$RUNNER_TEMP" && python - <<'PY'
          import os
          import noclick

          assert noclick.__version__ == os.environ["VERSION"]
          PY
          )

      - name: Upload the reviewed Python artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: noclick-python-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            sdk/python/dist/*.whl
            sdk/python/dist/*.tar.gz
            sdk/python/dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish-npm:
    needs: [detect-changes, build-npm, build-python]
    if: >-
      always() &&
      needs.detect-changes.outputs.typescript == 'true' &&
      needs.build-npm.result == 'success' &&
      (needs.detect-changes.outputs.python != 'true' || needs.build-python.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: release
    permissions:
      id-token: write # mint the OIDC token for npm trusted publishing
      contents: read
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm
        # OIDC trusted publishing requires npm >= 11.5.1.
        run: npm install -g npm@11.5.1

      - name: Download the reviewed npm artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: noclick-npm-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/npm-package

      - name: Verify the downloaded npm artifact
        env:
          PACKAGE_DIR: ${{ runner.temp }}/npm-package
        run: |
          set -euo pipefail
          cd "$PACKAGE_DIR"
          sha256sum -c SHA256SUMS
          shopt -s nullglob
          packages=(*.tgz)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "::error::expected one npm tarball, found ${#packages[@]}"
            exit 1
          fi
          echo "NPM_PACKAGE=$PACKAGE_DIR/${packages[0]}" >> "$GITHUB_ENV"

      - name: Publish the exact tarball to npm
        # No checkout, dependency install, build, or package script runs with
        # OIDC authority. Trusted publishing receives only the reviewed tarball.
        run: npm publish "$NPM_PACKAGE" --access public --ignore-scripts

  publish-pypi:
    needs: [detect-changes, build-npm, build-python]
    if: >-
      always() &&
      needs.detect-changes.outputs.python == 'true' &&
      needs.build-python.result == 'success' &&
      (needs.detect-changes.outputs.typescript != 'true' || needs.build-npm.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: release
    permissions:
      id-token: write # mint the OIDC token for PyPI trusted publishing
      contents: read
    steps:
      - name: Download the reviewed Python artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: noclick-python-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/python-package

      - name: Verify the downloaded Python artifacts
        env:
          PACKAGE_DIR: ${{ runner.temp }}/python-package
        run: |
          set -euo pipefail
          cd "$PACKAGE_DIR"
          sha256sum -c SHA256SUMS
          rm -f SHA256SUMS
          shopt -s nullglob
          wheels=(*.whl)
          sdists=(*.tar.gz)
          if [ "${#wheels[@]}" -ne 1 ] || [ "${#sdists[@]}" -ne 1 ]; then
            echo "::error::expected one wheel and one sdist"
            exit 1
          fi

      - name: Publish to PyPI
        # No token: auth comes from the OIDC trusted publisher configured on PyPI
        # for this repository's publish-sdk.yml.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: ${{ runner.temp }}/python-package
