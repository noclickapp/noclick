name: Installer E2E

# The install commands the README promises, run on genuinely fresh machines
# (every runner is a clean VM). Scheduled because installers rot silently:
# nothing else exercises them between releases.
#
# What CI can and cannot cover, honestly:
#   - Linux x64:   both paths, FULL boot — the readiness gates in install.sh
#                  and the launcher are the assertion.
#   - Linux arm64: full boot, informational until the backend image ships
#                  multi-arch (it is amd64-only today, so this documents the
#                  gap rather than hiding it).
#   - macOS:       mechanics only. GitHub's macOS runners cannot run Docker
#                  (no nested virtualization), so the assertion is that BOTH
#                  installers parse under BSD /bin/sh + darwin node and fail
#                  HELPFULLY — the docker guidance, not a stack trace.
#   - Windows:     launcher mechanics — npx must execute on win32 (PATH
#                  resolution, no sh-isms) — and the PowerShell installer up
#                  to the boot: the runner has Node, Git and a docker CLI, so
#                  it passes the installer's checks and hands off, and
#                  NOCLICK_NO_START stops the launcher after the checkout and
#                  .env, since the Linux images cannot run there. The branch
#                  that installs Docker Desktop (WSL2 + a restart) runs as a
#                  dry run only. Full boots on macOS/Windows need real
#                  machines; see oss/README.md for the local recipes.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  # A `release: published` trigger never fires here: the release is created
  # with the workflow's own token, and GitHub suppresses events from it. The
  # Release workflow's completion is observable regardless of token.
  workflow_run:
    workflows: [Release]
    types: [completed]

jobs:
  gate:
    # Skip everything when a Release run failed; the installers would only be
    # testing an image that was never promoted.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "installers run against the current release"

  curl-linux-x64:
    runs-on: ubuntu-latest
    needs: gate
    timeout-minutes: 30
    steps:
      - name: Install exactly as the README says
        run: curl -fsSL https://noclick.com/install.sh | sh
      - name: The app actually renders
        # The install gate passes when the URL answers; the first SSR can lag
        # it by seconds, so give the render a minute before calling it broken.
        run: |
          for i in $(seq 1 30); do
            curl -fsSL http://localhost:3000/ | grep -qi noclick && exit 0
            sleep 2
          done
          exit 1
      - name: What the stack says, if it broke
        if: failure()
        run: cd "$HOME/noclick" && docker compose ps && docker compose logs --tail 80

  npx-linux-x64:
    runs-on: ubuntu-latest
    needs: gate
    timeout-minutes: 30
    strategy:
      matrix:
        node: [18, 22]   # 18 is the README's stated minimum
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - name: Preflight the fresh machine
        run: npx -y noclick doctor
      - name: Install exactly as the README says
        run: npx -y noclick
      - name: The app actually renders
        # The install gate passes when the URL answers; the first SSR can lag
        # it by seconds, so give the render a minute before calling it broken.
        run: |
          for i in $(seq 1 30); do
            curl -fsSL http://localhost:3000/ | grep -qi noclick && exit 0
            sleep 2
          done
          exit 1
      - name: What the stack says, if it broke
        if: failure()
        run: cd "$(npx -y noclick where)" && docker compose ps && docker compose logs --tail 80

  curl-linux-arm64:
    runs-on: ubuntu-24.04-arm
    needs: gate
    timeout-minutes: 30
    # Informational until ghcr images ship linux/arm64 — today this documents
    # that ARM machines emulate or fail, rather than pretending they work.
    continue-on-error: true
    steps:
      - name: Install exactly as the README says
        run: curl -fsSL https://noclick.com/install.sh | sh
      - name: The app actually renders
        # The install gate passes when the URL answers; the first SSR can lag
        # it by seconds, so give the render a minute before calling it broken.
        run: |
          for i in $(seq 1 30); do
            curl -fsSL http://localhost:3000/ | grep -qi noclick && exit 0
            sleep 2
          done
          exit 1

  missing-prereqs:
    runs-on: ubuntu-latest
    needs: gate
    timeout-minutes: 10
    steps:
      - name: No docker at all — the script must say so, not stack-trace
        run: |
          docker run --rm debian:12-slim sh -c '
            apt-get update -qq >/dev/null && apt-get install -qq -y curl ca-certificates >/dev/null
            if curl -fsSL https://noclick.com/install.sh | sh > out.log 2>&1; then
              echo "should have failed"; exit 1
            fi
            grep -q "Docker is required" out.log && grep -q "get.docker.com" out.log'
      - name: Docker CLI without a daemon — the script must say that too
        run: |
          docker run --rm docker:27-cli sh -c '
            apk add -q curl
            if curl -fsSL https://noclick.com/install.sh | sh > out.log 2>&1; then
              echo "should have failed"; exit 1
            fi
            grep -q "not running" out.log'

  macos-mechanics:
    runs-on: macos-15
    needs: gate
    timeout-minutes: 10
    steps:
      - name: The shell installer parses under BSD sh and fails helpfully
        run: |
          if curl -fsSL https://noclick.com/install.sh | sh > out.log 2>&1; then
            echo "should have failed (no docker on this runner)"; exit 1
          fi
          grep -q "Docker is required" out.log
          grep -q "docs.docker.com/desktop/install/mac-install" out.log
      - name: The launcher runs on darwin and fails helpfully
        run: |
          if npx -y noclick doctor > out.log 2>&1; then
            echo "should have failed (no docker on this runner)"; exit 1
          fi
          grep -q "Docker is required" out.log

  windows-mechanics:
    runs-on: windows-latest
    needs: gate
    timeout-minutes: 15
    steps:
      - name: The launcher executes on win32
        run: npx -y noclick where
      - name: doctor reads this machine
        run: npx -y noclick doctor
      - name: The PowerShell installer runs as the README says, up to the boot
        env:
          NOCLICK_NO_START: "1"
        run: |
          irm https://noclick.com/install.ps1 | iex
          $dir = (npx -y noclick where | Out-String).Trim()
          foreach ($file in 'docker-compose.yml', '.env') {
            if (-not (Test-Path (Join-Path $dir $file))) { throw "the installer left no $file in $dir" }
          }
      - name: Without Docker Desktop the installer would install it (dry run)
        # The real branch enables WSL2 and restarts the machine, which would
        # kill the runner; the dry run walks the same decision and stops.
        env:
          NOCLICK_INSTALLER_DRY_RUN: "1"
        run: |
          # Stripping "docker" directories from PATH left the runner's Docker
          # reachable, so the installer rightly saw it and handed off to a
          # compose pull on a Windows-containers daemon. Hide the binary itself.
          $hidden = @()
          foreach ($cmd in 'docker', 'docker-compose') {
            $bin = (Get-Command $cmd -ErrorAction SilentlyContinue).Source
            if ($bin) { Rename-Item $bin "$bin.hidden"; $hidden += "$bin.hidden" }
          }
          $hidden | Set-Content hidden-binaries.txt
          if (Get-Command docker -ErrorAction SilentlyContinue) { throw "docker is still reachable" }
          irm https://noclick.com/install.ps1 -OutFile install.ps1
          $out = & powershell -NoProfile -ExecutionPolicy Bypass -File .\install.ps1 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "dry run should exit 0:`n$out" }
          if ($out -notmatch 'install Docker Desktop' -or $out -notmatch 'restarts once') { throw "dry run did not describe the plan:`n$out" }
          if ($out -match 'Handing off') { throw "a dry run must never hand off:`n$out" }
      - name: With Docker present a dry run reports the plan and never hands off
        env:
          NOCLICK_INSTALLER_DRY_RUN: "1"
        run: |
          foreach ($bin in (Get-Content hidden-binaries.txt)) { Rename-Item $bin ($bin -replace '\.hidden$', '') }
          if (-not (Get-Command docker -ErrorAction SilentlyContinue)) { throw "docker should be back" }
          $out = & powershell -NoProfile -ExecutionPolicy Bypass -File .\install.ps1 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "dry run should exit 0:`n$out" }
          if ($out -notmatch 'Dry run') { throw "dry run did not describe the plan:`n$out" }
          if ($out -match 'Handing off') { throw "a dry run must never hand off:`n$out" }
