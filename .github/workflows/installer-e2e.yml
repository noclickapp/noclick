name: Installer E2E

# The install commands the README promises, run on genuinely fresh machines
# (every runner is a clean VM). Scheduled because installers rot silently:
# nothing else exercises them between releases.
#
# What CI can and cannot cover, honestly:
#   - Linux x64:   FULL boot — the readiness gate in install.sh is the
#                  assertion.
#   - Linux arm64: full boot, informational until the backend image ships
#                  multi-arch (it is amd64-only today, so this documents the
#                  gap rather than hiding it).
#   - macOS:       mechanics only. GitHub's macOS runners cannot run Docker
#                  (no nested virtualization), so the assertion is that the
#                  installer parses under BSD /bin/sh and fails HELPFULLY —
#                  the docker guidance, not a stack trace. Full boots on
#                  macOS need a real machine; see oss/README.md for the local
#                  recipe.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  # A `release: published` trigger never fires here: the release is created
  # with the workflow's own token, and GitHub suppresses events from it. The
  # Release workflow's completion is observable regardless of token.
  workflow_run:
    workflows: [Release]
    types: [completed]

jobs:
  gate:
    # Skip everything when a Release run failed; the installers would only be
    # testing an image that was never promoted.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "installers run against the current release"

  curl-linux-x64:
    runs-on: ubuntu-latest
    needs: gate
    timeout-minutes: 30
    steps:
      - name: Install exactly as the README says
        run: curl -fsSL https://noclick.com/install.sh | sh
      - name: The app actually renders
        # The install gate passes when the URL answers; the first SSR can lag
        # it by seconds, so give the render a minute before calling it broken.
        run: |
          for i in $(seq 1 30); do
            curl -fsSL http://localhost:3000/ | grep -qi noclick && exit 0
            sleep 2
          done
          exit 1
      - name: A file round-trips through the signed URLs a browser uploads to
        # The backend mints the URLs exactly as for an upload in the app; the
        # PUT and GET then go over the published port, as the browser's do.
        run: |
          cd "$HOME/noclick"
          docker compose exec -T backend python -c '
          from utils.r2_cloudflare import generate_presigned_download_url, generate_presigned_upload_url
          key = "installer-e2e/hello.txt"
          print(generate_presigned_upload_url("workflow-resources", key, "text/plain", content_length=5))
          print(generate_presigned_download_url("workflow-resources", key))' > urls.txt
          curl -fsS -X PUT -H "Content-Type: text/plain" --data-binary hello "$(sed -n 1p urls.txt)"
          test "$(curl -fsS "$(sed -n 2p urls.txt)")" = hello
      - name: What the stack says, if it broke
        if: failure()
        run: cd "$HOME/noclick" && docker compose ps && docker compose logs --tail 80

  curl-linux-arm64:
    runs-on: ubuntu-24.04-arm
    needs: gate
    timeout-minutes: 30
    # A real boot on arm64: since v0.3.4 the images are multi-arch, so this
    # gates like the x64 jobs.
    steps:
      - name: Install exactly as the README says
        run: curl -fsSL https://noclick.com/install.sh | sh
      - name: The app actually renders
        # The install gate passes when the URL answers; the first SSR can lag
        # it by seconds, so give the render a minute before calling it broken.
        run: |
          for i in $(seq 1 30); do
            curl -fsSL http://localhost:3000/ | grep -qi noclick && exit 0
            sleep 2
          done
          exit 1

  missing-prereqs:
    runs-on: ubuntu-latest
    needs: gate
    timeout-minutes: 10
    steps:
      - name: No docker at all — the script must say so, not stack-trace
        run: |
          docker run --rm debian:12-slim sh -c '
            apt-get update -qq >/dev/null && apt-get install -qq -y curl ca-certificates >/dev/null
            if curl -fsSL https://noclick.com/install.sh | sh > out.log 2>&1; then
              echo "should have failed"; exit 1
            fi
            grep -q "Docker is required" out.log && grep -q "get.docker.com" out.log'
      - name: Docker CLI without a daemon — the script must say that too
        run: |
          docker run --rm docker:27-cli sh -c '
            apk add -q curl
            if curl -fsSL https://noclick.com/install.sh | sh > out.log 2>&1; then
              echo "should have failed"; exit 1
            fi
            grep -q "not running" out.log'

  macos-mechanics:
    runs-on: macos-15
    needs: gate
    timeout-minutes: 10
    steps:
      - name: The shell installer parses under BSD sh and fails helpfully
        run: |
          if curl -fsSL https://noclick.com/install.sh | sh > out.log 2>&1; then
            echo "should have failed (no docker on this runner)"; exit 1
          fi
          grep -q "Docker is required" out.log
          grep -q "docs.docker.com/desktop/install/mac-install" out.log
