name: Secret scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Block hidden repository transports in reachable history
        run: python3 scripts/check-repository-transport.py --history HEAD .
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.24.x"
          cache: false
      - run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - run: gitleaks git . --redact --no-banner
      - name: Block real-shaped credentials in every historical blob
        run: python3 scripts/scan_real_secrets.py .
