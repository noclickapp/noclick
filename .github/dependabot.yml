version: 2

# Version-update branches stay disabled during the first-cut ref quarantine.
# `open-pull-requests-limit: 0` does not disable Dependabot security updates.
# Remove these limits in a reviewed PR only after ordinary proposal-branch
# creation is deliberately enabled.
updates:
  - package-ecosystem: pip
    directory: /
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directories:
      - /
      - /backend
      - /frontend
      - /sdk/typescript
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    groups:
      javascript-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /docker
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    groups:
      containers:
        patterns: ["*"]
